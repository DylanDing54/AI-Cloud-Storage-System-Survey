<text xml:space="preserve" x="612" y="232" text-anchor="middle" font-size="10.5" fill="#1f2937" font-family="PingFang SC, sans-serif">前缀索引（来自树）</text>
<text xml:space="preserve" x="765" y="232" text-anchor="middle" font-size="10.5" fill="#1f2937" font-family="PingFang SC, sans-serif">新 token 的 out_cache_loc</text>
<text xml:space="preserve" x="901" y="232" text-anchor="middle" font-size="10.5" fill="#6b7280" font-family="PingFang SC, sans-serif">未用</text>
<rect x="528" y="256" width="440" height="146" rx="7" fill="#edf7f0" stroke="#2e7d4f" stroke-width="1.4"/>
<text xml:space="preserve" x="538" y="275" text-anchor="start" font-size="13.5" font-weight="600" fill="#1f2937" font-family="PingFang SC, sans-serif">PagedTokenToKVPoolAllocator（page_size&gt;1）</text>
<text xml:space="preserve" x="538" y="292.5" text-anchor="start" font-size="11.5" fill="#374151" font-family="PingFang SC, sans-serif">free_pages：空闲页号张量（页 0 保留给填充写）</text>
<text xml:space="preserve" x="538" y="309.5" text-anchor="start" font-size="11.5" fill="#374151" font-family="PingFang SC, sans-serif">staged_pages：已释放、待 merge_and_sort_free 排序合并</text>
<text xml:space="preserve" x="538" y="326.5" text-anchor="start" font-size="11.5" fill="#374151" font-family="PingFang SC, sans-serif">alloc(n) / alloc_extend(...) / alloc_decode(...)</text>
<text xml:space="preserve" x="538" y="343.5" text-anchor="start" font-size="11.5" fill="#374151" font-family="PingFang SC, sans-serif">free(idx) / free_segment(idx, start_pos)：按整页回收</text>
<text xml:space="preserve" x="538" y="360.5" text-anchor="start" font-size="11.5" fill="#374151" font-family="PingFang SC, sans-serif">槽位索引 = 页号 × page_size + 页内偏移</text>
<rect x="528" y="430" width="440" height="110" rx="7" fill="#eef4fb" stroke="#4a77b4" stroke-width="1.4"/>
<text xml:space="preserve" x="538" y="449" text-anchor="start" font-size="13.5" font-weight="600" fill="#1f2937" font-family="PingFang SC, sans-serif">MHATokenToKVPool（KVCache 子类）</text>
<text xml:space="preserve" x="538" y="466.5" text-anchor="start" font-size="11.5" fill="#374151" font-family="PingFang SC, sans-serif">k_buffer[layer] / v_buffer[layer]：每层一块显存张量</text>
<text xml:space="preserve" x="538" y="483.5" text-anchor="start" font-size="11.5" fill="#374151" font-family="PingFang SC, sans-serif">NHD 布局：[size + page_size, head_num, head_dim]</text>
<text xml:space="preserve" x="538" y="500.5" text-anchor="start" font-size="11.5" fill="#374151" font-family="PingFang SC, sans-serif">注意力后端按 out_cache_loc 调用 set_kv_buffer 写入</text>
<rect x="528" y="556" width="440" height="74" rx="7" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.4"/>
<text xml:space="preserve" x="538" y="575" text-anchor="start" font-size="13.5" font-weight="600" fill="#1f2937" font-family="PingFang SC, sans-serif">调度器辅助树</text>
<text xml:space="preserve" x="538" y="592.5" text-anchor="start" font-size="11.5" fill="#374151" font-family="PingFang SC, sans-serif">SchedulePolicy.waiting_queue_radix_tree = RadixCache</text>
<text xml:space="preserve" x="538" y="609.5" text-anchor="start" font-size="11.5" fill="#374151" font-family="PingFang SC, sans-serif">.create_simulated()：只存 token、不存 KV，用于同批去重</text>
<path d="M838,256 L838,240" fill="none" stroke="#2e7d4f" stroke-width="1.6" marker-end="url(#ag)"/>
<text xml:space="preserve" x="846" y="252" text-anchor="start" font-size="11" fill="#2e7d4f" font-family="PingFang SC, sans-serif">分配的索引写入</text>
<path d="M748,402 L748,428" fill="none" stroke="#2e7d4f" stroke-width="1.6" marker-end="url(#ag)"/>
<text xml:space="preserve" x="756" y="420" text-anchor="start" font-size="11" fill="#2e7d4f" font-family="PingFang SC, sans-serif">管理其中的槽位</text>
<path d="M380,200 L500,200 L500,470 L526,470" fill="none" stroke="#4a77b4" stroke-width="1.6" marker-end="url(#ab)"/>
<text xml:space="preserve" x="388" y="193" text-anchor="start" font-size="11" fill="#4a77b4" font-family="PingFang SC, sans-serif">value→KV 槽位</text>
<path d="M968,228 L978,228 L978,500 L970,500" fill="none" stroke="#4a77b4" stroke-width="1.6" marker-end="url(#ab)"/>
<rect x="15" y="655" width="970" height="120" rx="7" fill="#f3effa" stroke="#7b5ea7" stroke-width="1.4"/>
<text xml:space="preserve" x="25" y="674" text-anchor="start" font-size="13.5" font-weight="600" fill="#1f2937" font-family="PingFang SC, sans-serif">两层间接寻址如何实现前缀共享</text>
<text xml:space="preserve" x="25" y="692" text-anchor="start" font-size="12" fill="#374151" font-family="PingFang SC, sans-serif">1. 新请求 match_prefix 命中节点 A：把 A 的 value（16 个索引）写到自己 req_to_token 行的开头，不复制 KV，只复制索引。</text>
<text xml:space="preserve" x="25" y="709.5" text-anchor="start" font-size="12" fill="#374151" font-family="PingFang SC, sans-serif">2. 未命中的 token 由 allocator 分配新槽位，prefill 写入 KV；注意力核按 req_to_token 行去 k/v_buffer 取数据。</text>
<text xml:space="preserve" x="25" y="727.0" text-anchor="start" font-size="12" fill="#374151" font-family="PingFang SC, sans-serif">3. 请求结束时 _insert_cache 把整行（页对齐部分）插入树：已在树中的重复槽位 free_segment 归还，新增部分由树节点持有。</text>
<text xml:space="preserve" x="25" y="744.5" text-anchor="start" font-size="12" fill="#374151" font-family="PingFang SC, sans-serif">4. page_size&gt;1 时 RadixKey.page_aligned() 把键截到整页，match() 结果向下取整到 page_size 倍数，分配与淘汰都以页为单位。</text>
</svg>