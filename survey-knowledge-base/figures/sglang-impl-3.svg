<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="790" viewBox="0 0 1000 790">
<defs><marker id="ak" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#4b5563"/></marker><marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#c0392b"/></marker><marker id="ag" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#2e7d4f"/></marker><marker id="ab" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#4a77b4"/></marker><marker id="ao" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#c9781d"/></marker><marker id="ap" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#7b5ea7"/></marker></defs>
<rect x="0" y="0" width="1000" height="790" fill="#ffffff"/>
<text xml:space="preserve" x="500.0" y="30" text-anchor="middle" font-size="19" font-weight="600" fill="#1f2937" font-family="PingFang SC, sans-serif">SGLang 前缀缓存的数据结构：RadixCache 树 + 两级索引内存池（固定提交 c712459）</text>
<rect x="15" y="50" width="475" height="590" rx="10" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.2"/>
<text xml:space="preserve" x="27" y="70" text-anchor="start" font-size="13" font-weight="600" fill="#4b5563" font-family="PingFang SC, sans-serif">CPU 侧 · RadixCache（radix_cache.py，树只在 CPU 上维护）</text>
<rect x="160" y="82" width="180" height="50" rx="7" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.4"/>
<text xml:space="preserve" x="170" y="101" text-anchor="start" font-size="13.5" font-weight="600" fill="#1f2937" font-family="PingFang SC, sans-serif">root_node</text>
<text xml:space="preserve" x="170" y="118" text-anchor="start" font-size="11" fill="#374151" font-family="PingFang SC, sans-serif">key=[]，lock_ref=1</text>
<rect x="120" y="165" width="260" height="70" rx="7" fill="#eef4fb" stroke="#4a77b4" stroke-width="1.4"/>
<text xml:space="preserve" x="130" y="184" text-anchor="start" font-size="13.5" font-weight="600" fill="#1f2937" font-family="PingFang SC, sans-serif">TreeNode A（共享前缀）</text>
<text xml:space="preserve" x="130" y="201.5" text-anchor="start" font-size="11.5" fill="#374151" font-family="PingFang SC, sans-serif">key: RadixKey(token_ids=t0…t15)</text>
<text xml:space="preserve" x="130" y="218.5" text-anchor="start" font-size="11.5" fill="#374151" font-family="PingFang SC, sans-serif">value: 16 个 KV 槽位索引，lock_ref=2</text>
<rect x="28" y="275" width="215" height="70" rx="7" fill="#eef4fb" stroke="#4a77b4" stroke-width="1.4"/>
<text xml:space="preserve" x="38" y="294" text-anchor="start" font-size="13.5" font-weight="600" fill="#1f2937" font-family="PingFang SC, sans-serif">TreeNode B（叶）</text>
<text xml:space="preserve" x="38" y="311.5" text-anchor="start" font-size="11.5" fill="#374151" font-family="PingFang SC, sans-serif">key=t16…t31，value=16 个索引</text>
<text xml:space="preserve" x="38" y="328.5" text-anchor="start" font-size="11.5" fill="#374151" font-family="PingFang SC, sans-serif">lock_ref=1：有请求在用</text>
<rect x="258" y="275" width="200" height="70" rx="7" fill="#fdf3e7" stroke="#c9781d" stroke-width="1.4"/>
<text xml:space="preserve" x="268" y="294" text-anchor="start" font-size="13.5" font-weight="600" fill="#1f2937" font-family="PingFang SC, sans-serif">TreeNode C（叶）</text>
<text xml:space="preserve" x="268" y="311.5" text-anchor="start" font-size="11.5" fill="#374151" font-family="PingFang SC, sans-serif">key=t16'…t23'，lock_ref=0</text>
<text xml:space="preserve" x="268" y="328.5" text-anchor="start" font-size="11.5" fill="#374151" font-family="PingFang SC, sans-serif">→ 在 evictable_leaves 中</text>
<path d="M250,132 L250,165" fill="none" stroke="#4b5563" stroke-width="1.6" marker-end="url(#ak)"/>
<text xml:space="preserve" x="258" y="153" text-anchor="start" font-size="11" fill="#4b5563" font-family="PingFang SC, sans-serif">children[child_key]</text>
<path d="M200,235 L140,275" fill="none" stroke="#4b5563" stroke-width="1.6" marker-end="url(#ak)"/>
<path d="M300,235 L360,275" fill="none" stroke="#4b5563" stroke-width="1.6" marker-end="url(#ak)"/>
<text xml:space="preserve" x="30" y="364" text-anchor="start" font-size="11" fill="#6b7280" font-family="PingFang SC, sans-serif">child_key：page_size=1 取首 token，&gt;1 取首页 token 元组</text>
<rect x="28" y="375" width="450" height="152" rx="7" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.4"/>
<text xml:space="preserve" x="38" y="394" text-anchor="start" font-size="13.5" font-weight="600" fill="#1f2937" font-family="PingFang SC, sans-serif">TreeNode 主要字段</text>
<text xml:space="preserve" x="38" y="411.5" text-anchor="start" font-size="11.5" fill="#374151" font-family="PingFang SC, sans-serif">children: dict（child_key → TreeNode）；parent</text>
<text xml:space="preserve" x="38" y="428.5" text-anchor="start" font-size="11.5" fill="#374151" font-family="PingFang SC, sans-serif">key: RadixKey(token_ids, extra_key, cache_salt)：一段连续 token</text>
<text xml:space="preserve" x="38" y="445.5" text-anchor="start" font-size="11.5" fill="#374151" font-family="PingFang SC, sans-serif">value: torch.Tensor，与 key 等长，存这些 token 的 KV 槽位索引</text>
<text xml:space="preserve" x="38" y="462.5" text-anchor="start" font-size="11.5" fill="#374151" font-family="PingFang SC, sans-serif">lock_ref：路径上正在被请求使用的计数，&gt;0 不可淘汰</text>
<text xml:space="preserve" x="38" y="479.5" text-anchor="start" font-size="11.5" fill="#374151" font-family="PingFang SC, sans-serif">last_access_time / hit_count / priority / creation_time</text>
<text xml:space="preserve" x="38" y="496.5" text-anchor="start" font-size="11.5" fill="#374151" font-family="PingFang SC, sans-serif">evicted ⇔ value is None；hash_value 供 KV 事件使用</text>
<rect x="28" y="540" width="450" height="90" rx="7" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.4"/>
<text xml:space="preserve" x="38" y="559" text-anchor="start" font-size="13.5" font-weight="600" fill="#1f2937" font-family="PingFang SC, sans-serif">RadixCache 计数与策略</text>
<text xml:space="preserve" x="38" y="576.5" text-anchor="start" font-size="11.5" fill="#374151" font-family="PingFang SC, sans-serif">evictable_size_ / protected_size_：可淘汰与被锁 token 数</text>
<text xml:space="preserve" x="38" y="593.5" text-anchor="start" font-size="11.5" fill="#374151" font-family="PingFang SC, sans-serif">evictable_leaves：无未淘汰子节点且 lock_ref=0 的叶集合</text>
<text xml:space="preserve" x="38" y="610.5" text-anchor="start" font-size="11.5" fill="#374151" font-family="PingFang SC, sans-serif">eviction_strategy：--radix-eviction-policy，默认 lru</text>
<rect x="510" y="50" width="475" height="590" rx="10" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.2"/>
<text xml:space="preserve" x="522" y="70" text-anchor="start" font-size="13" font-weight="600" fill="#4b5563" font-family="PingFang SC, sans-serif">GPU 侧 · 内存池（memory_pool.py、allocator/paged.py）</text>
<rect x="528" y="82" width="440" height="128" rx="7" fill="#eef4fb" stroke="#4a77b4" stroke-width="1.4"/>
<text xml:space="preserve" x="538" y="101" text-anchor="start" font-size="13.5" font-weight="600" fill="#1f2937" font-family="PingFang SC, sans-serif">ReqToTokenPool（请求 → token 位置）</text>
<text xml:space="preserve" x="538" y="118.5" text-anchor="start" font-size="11.5" fill="#374151" font-family="PingFang SC, sans-serif">req_to_token：int32 张量 [size+1, max_context_len]</text>
<text xml:space="preserve" x="538" y="135.5" text-anchor="start" font-size="11.5" fill="#374151" font-family="PingFang SC, sans-serif">每行对应一个运行中请求，第 i 列 = 第 i 个 token 的槽位</text>
<text xml:space="preserve" x="538" y="152.5" text-anchor="start" font-size="11.5" fill="#374151" font-family="PingFang SC, sans-serif">free_slots：空闲行号（行 0 留给 CUDA Graph 填充）</text>
<text xml:space="preserve" x="538" y="169.5" text-anchor="start" font-size="11.5" fill="#374151" font-family="PingFang SC, sans-serif">alloc(reqs) 取行；write(indices, values) 写入索引</text>
<rect x="544" y="218" width="34" height="20" fill="#dbe7f6" stroke="#9ca3af"/>
<rect x="578" y="218" width="34" height="20" fill="#dbe7f6" stroke="#9ca3af"/>
<rect x="612" y="218" width="34" height="20" fill="#dbe7f6" stroke="#9ca3af"/>
