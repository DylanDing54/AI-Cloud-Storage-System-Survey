<rect x="748" y="218" width="34" height="20" fill="#e3f2e8" stroke="#9ca3af"/>
<rect x="782" y="218" width="34" height="20" fill="#e3f2e8" stroke="#9ca3af"/>
<rect x="816" y="218" width="34" height="20" fill="#e3f2e8" stroke="#9ca3af"/>
