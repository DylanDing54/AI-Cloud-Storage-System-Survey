<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 497"><title>推理服务物理数据路径示例</title><defs><marker id="g" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 Z" fill="#39764d"/></marker><marker id="b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 Z" fill="#306d91"/></marker><marker id="s" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 Z" fill="#985c21"/></marker></defs><rect width="1080" height="497" fill="#fff"/><g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif"><text x="20" y="36" font-size="26" font-weight="700" fill="#354740">一次跨节点 KV 传输经过哪些硬件</text><text x="20" y="70" font-size="18" font-weight="400" fill="#354740">示例部署：两台计算节点通过交换网络互通，存储节点也可使用独立网络。</text><rect x="20" y="100" width="247" height="88" rx="9" fill="#ecf4f8" stroke="#99bacd" stroke-width="2"/><text x="35" y="131" font-size="21" font-weight="700" fill="#354740">Prefill 节点</text><text x="35" y="158" font-size="16" font-weight="400" fill="#354740">加速卡 / HBM 与 KV 张量</text><rect x="321" y="100" width="197" height="88" rx="9" fill="#ecf4f8" stroke="#99bacd" stroke-width="2"/><text x="336" y="131" font-size="21" font-weight="700" fill="#354740">RDMA 网卡</text><text x="336" y="158" font-size="16" font-weight="400" fill="#354740">注册缓冲区、DMA</text><path d="M267 144 H318" fill="none" stroke="#306d91" stroke-width="3" marker-end="url(#b)" marker-start="url(#b)"/><rect x="20" y="241" width="247" height="88" rx="9" fill="#ecf4f8" stroke="#99bacd" stroke-width="2"/><text x="35" y="272" font-size="21" font-weight="700" fill="#354740">Decode 节点</text><text x="35" y="299" font-size="16" font-weight="400" fill="#354740">加速卡 / HBM 与 KV 张量</text><rect x="321" y="241" width="197" height="88" rx="9" fill="#ecf4f8" stroke="#99bacd" stroke-width="2"/><text x="336" y="272" font-size="21" font-weight="700" fill="#354740">RDMA 网卡</text><text x="336" y="299" font-size="16" font-weight="400" fill="#354740">注册缓冲区、DMA</text><path d="M267 285 H318" fill="none" stroke="#306d91" stroke-width="3" marker-end="url(#b)" marker-start="url(#b)"/><text x="24" y="218" font-size="16" font-weight="400" fill="#354740">设备与网卡之间的路径取决于 PCIe 拓扑和驱动支持。</text><rect x="653" y="155" width="398" height="104" rx="9" fill="#eef5ee" stroke="#99b8a2" stroke-width="2"/><text x="668" y="186" font-size="21" font-weight="700" fill="#354740">交换网络</text><text x="668" y="213" font-size="16" font-weight="400" fill="#354740">同机架可经 Leaf；跨机架可能经过 Spine。</text><text x="668" y="235" font-size="16" font-weight="400" fill="#354740">并发时还要计入上联带宽与端口排队。</text><path d="M518 144 H590 V182 H650" fill="none" stroke="#39764d" stroke-width="3" marker-end="url(#g)" marker-start="url(#g)"/><path d="M518 285 H590 V232 H650" fill="none" stroke="#39764d" stroke-width="3" marker-end="url(#g)" marker-start="url(#g)"/><rect x="20" y="377" width="294" height="83" rx="9" fill="#fbf4e9" stroke="#c6ac88" stroke-width="2"/><text x="35" y="408" font-size="21" font-weight="700" fill="#354740">主机内存 / 软件队列</text><text x="35" y="435" font-size="16" font-weight="400" fill="#354740">暂存、校验、注册或异步回填</text><rect x="406" y="377" width="256" height="83" rx="9" fill="#fbf4e9" stroke="#c6ac88" stroke-width="2"/><text x="421" y="408" font-size="21" font-weight="700" fill="#354740">存储节点 / 控制器</text><text x="421" y="435" font-size="16" font-weight="400" fill="#354740">分片、排队、读写与冗余</text><rect x="748" y="377" width="303" height="83" rx="9" fill="#fbf4e9" stroke="#c6ac88" stroke-width="2"/><text x="763" y="408" font-size="21" font-weight="700" fill="#354740">介质</text><text x="763" y="435" font-size="16" font-weight="400" fill="#354740">NVMe SSD / HDD 阵列</text><path d="M314 418 H403" fill="none" stroke="#985c21" stroke-width="3" marker-end="url(#s)" marker-start="url(#s)"/><path d="M662 418 H745" fill="none" stroke="#985c21" stroke-width="3" marker-end="url(#s)" marker-start="url(#s)"/><text x="23" y="362" font-size="16" font-weight="400" fill="#354740">存储支路示例（逻辑顺序）：远端文件读取还会消耗网络，实际部署可与计算流量共享或隔离。</text></g></svg>