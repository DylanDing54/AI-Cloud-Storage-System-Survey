<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 533"><title>SGLang 在线推理与 KV 数据路径</title><defs><marker id="g" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 Z" fill="#39764d"/></marker><marker id="b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 Z" fill="#306d91"/></marker><marker id="s" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 Z" fill="#985c21"/></marker></defs><rect width="1080" height="533" fill="#fff"/><g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif"><text x="20" y="32" font-size="26" font-weight="700" fill="#354740">SGLang 在线推理架构</text><text x="20" y="65" font-size="18" font-weight="400" fill="#354740">实线箭头标出请求、结果与 KV 的流向。下方两条支路按部署启用。</text><rect x="20" y="97" width="225" height="87" rx="9" fill="#eef5ee" stroke="#99b8a2" stroke-width="2"/><text x="35" y="128" font-size="21" font-weight="700" fill="#354740">服务入口</text><text x="35" y="155" font-size="16" font-weight="400" fill="#354740">HTTP / TokenizerManager</text><text x="35" y="177" font-size="16" font-weight="400" fill="#354740">文本 → token ID</text><rect x="305" y="97" width="240" height="87" rx="9" fill="#eef5ee" stroke="#99b8a2" stroke-width="2"/><text x="320" y="128" font-size="21" font-weight="700" fill="#354740">Scheduler</text><text x="320" y="155" font-size="16" font-weight="400" fill="#354740">等待队列、组批、前缀匹配</text><text x="320" y="177" font-size="16" font-weight="400" fill="#354740">RadixCache / HiRadixCache</text><rect x="615" y="97" width="440" height="87" rx="9" fill="#eef5ee" stroke="#99b8a2" stroke-width="2"/><text x="630" y="128" font-size="21" font-weight="700" fill="#354740">TpModelWorker / ModelRunner</text><text x="630" y="155" font-size="16" font-weight="400" fill="#354740">执行模型前向与采样；按设备 rank 调度计算</text><path d="M245 140 H302" fill="none" stroke="#39764d" stroke-width="3" marker-end="url(#g)"/><path d="M545 140 H612" fill="none" stroke="#39764d" stroke-width="3" marker-end="url(#g)"/><rect x="20" y="225" width="270" height="83" rx="9" fill="#eef5ee" stroke="#99b8a2" stroke-width="2"/><text x="35" y="256" font-size="21" font-weight="700" fill="#354740">文本输出</text><text x="35" y="283" font-size="16" font-weight="400" fill="#354740">DetokenizerManager → 客户端</text><path d="M680 184 V206 H155 V222" fill="none" stroke="#39764d" stroke-width="3" marker-end="url(#g)"/><rect x="615" y="225" width="440" height="83" rx="9" fill="#ecf4f8" stroke="#99bacd" stroke-width="2"/><text x="630" y="256" font-size="21" font-weight="700" fill="#354740">L1 · 加速卡 HBM</text><text x="630" y="283" font-size="16" font-weight="400" fill="#354740">模型权重、注意力 KV 张量；按槽位读写</text><path d="M900 184 V222" fill="none" stroke="#306d91" stroke-width="3" marker-end="url(#b)" marker-start="url(#b)"/><rect x="315" y="375" width="280" height="92" rx="9" fill="#ecf4f8" stroke="#99bacd" stroke-width="2"/><text x="330" y="406" font-size="21" font-weight="700" fill="#354740">L2 · 主机 DRAM</text><text x="330" y="433" font-size="16" font-weight="400" fill="#354740">每实例的 host pool；按页预取，</text><text x="330" y="455" font-size="16" font-weight="400" fill="#354740">按层回填至加速卡</text><rect x="20" y="375" width="239" height="92" rx="9" fill="#fbf4e9" stroke="#c6ac88" stroke-width="2"/><text x="35" y="406" font-size="21" font-weight="700" fill="#354740">L3 · 可选后端</text><text x="35" y="433" font-size="16" font-weight="400" fill="#354740">本地文件 / 分布式存储</text><text x="35" y="455" font-size="16" font-weight="400" fill="#354740">后端决定是否经过网络</text><path d="M315 422 H262" fill="none" stroke="#985c21" stroke-width="3" marker-end="url(#s)" marker-start="url(#s)"/><path d="M455 375 V282 H611" fill="none" stroke="#306d91" stroke-width="3" marker-end="url(#b)" marker-start="url(#b)"/><rect x="700" y="375" width="355" height="92" rx="9" fill="#ecf4f8" stroke="#99bacd" stroke-width="2"/><text x="715" y="406" font-size="21" font-weight="700" fill="#354740">独立 Decode 实例</text><text x="715" y="433" font-size="16" font-weight="400" fill="#354740">P/D 分离时接收 KV 后继续生成；</text><text x="715" y="455" font-size="16" font-weight="400" fill="#354740">传输引擎可选 Mooncake / NIXL</text><path d="M870 308 V372" fill="none" stroke="#306d91" stroke-width="3" marker-end="url(#b)"/><text x="20" y="504" font-size="18" font-weight="400" fill="#354740">绿色：请求与结果     蓝色：计算状态与设备间传输     棕色：持久层或共享缓存访问</text></g></svg>