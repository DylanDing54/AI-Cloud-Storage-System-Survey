<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760" viewBox="0 0 1000 760">
<defs><marker id="ak" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#4b5563"/></marker><marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#c0392b"/></marker><marker id="ag" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#2e7d4f"/></marker><marker id="ab" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#4a77b4"/></marker><marker id="ao" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#c9781d"/></marker><marker id="ap" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#7b5ea7"/></marker></defs>
<rect x="0" y="0" width="1000" height="760" fill="#ffffff"/>
<text xml:space="preserve" x="500.0" y="30" text-anchor="middle" font-size="19" font-weight="600" fill="#1f2937" font-family="PingFang SC, sans-serif">一个请求的 KV 生命周期：匹配 → 分配 → 前向 → 插入 → 释放 → 淘汰（固定提交 c712459）</text>
<rect x="12" y="55" width="318" height="168" rx="7" fill="#eef4fb" stroke="#4a77b4" stroke-width="1.4"/>
<text xml:space="preserve" x="22" y="74" text-anchor="start" font-size="13.5" font-weight="600" fill="#1f2937" font-family="PingFang SC, sans-serif">① 入队与前缀匹配</text>
<text xml:space="preserve" x="22" y="91.5" text-anchor="start" font-size="11.5" fill="#374151" font-family="PingFang SC, sans-serif">Scheduler._add_request_to_queue</text>
<text xml:space="preserve" x="22" y="108.5" text-anchor="start" font-size="11.5" fill="#374151" font-family="PingFang SC, sans-serif">SchedulePolicy.calc_priority</text>
<text xml:space="preserve" x="22" y="125.5" text-anchor="start" font-size="11.5" fill="#374151" font-family="PingFang SC, sans-serif">  → match_kv_cache → match_prefix(RadixKey)</text>
<text xml:space="preserve" x="22" y="142.5" text-anchor="start" font-size="11.5" fill="#374151" font-family="PingFang SC, sans-serif">沿 children 逐段比较，止于节点中间则</text>
<text xml:space="preserve" x="22" y="159.5" text-anchor="start" font-size="11.5" fill="#374151" font-family="PingFang SC, sans-serif">  _split_node；得 prefix_len / last_node</text>
<text xml:space="preserve" x="22" y="176.5" text-anchor="start" font-size="11.5" fill="#374151" font-family="PingFang SC, sans-serif">（开启 L3 时入队即 _prefetch_kvcache）</text>
<rect x="341" y="55" width="318" height="168" rx="7" fill="#eef4fb" stroke="#4a77b4" stroke-width="1.4"/>
<text xml:space="preserve" x="351" y="74" text-anchor="start" font-size="13.5" font-weight="600" fill="#1f2937" font-family="PingFang SC, sans-serif">② 缓存感知排序</text>
<text xml:space="preserve" x="351" y="91.5" text-anchor="start" font-size="11.5" fill="#374151" font-family="PingFang SC, sans-serif">--schedule-policy lpm：按命中长度</text>
<text xml:space="preserve" x="351" y="108.5" text-anchor="start" font-size="11.5" fill="#374151" font-family="PingFang SC, sans-serif">  -num_matched_prefix_tokens 降序</text>
<text xml:space="preserve" x="351" y="125.5" text-anchor="start" font-size="11.5" fill="#374151" font-family="PingFang SC, sans-serif">命中 ≤32 token 的请求查 waiting_queue_</text>
<text xml:space="preserve" x="351" y="142.5" text-anchor="start" font-size="11.5" fill="#374151" font-family="PingFang SC, sans-serif">  radix_tree，同前缀者暂缓（同批去重）</text>
<text xml:space="preserve" x="351" y="159.5" text-anchor="start" font-size="11.5" fill="#374151" font-family="PingFang SC, sans-serif">队列 &gt;128 时 LPM 退化为 FCFS</text>
<text xml:space="preserve" x="351" y="176.5" text-anchor="start" font-size="11.5" fill="#374151" font-family="PingFang SC, sans-serif">默认 fcfs；另有 dfs-weight/lof/hrrn 等</text>
<rect x="670" y="55" width="318" height="168" rx="7" fill="#edf7f0" stroke="#2e7d4f" stroke-width="1.4"/>
<text xml:space="preserve" x="680" y="74" text-anchor="start" font-size="13.5" font-weight="600" fill="#1f2937" font-family="PingFang SC, sans-serif">③ 准入、分块与加锁</text>
<text xml:space="preserve" x="680" y="91.5" text-anchor="start" font-size="11.5" fill="#374151" font-family="PingFang SC, sans-serif">PrefillAdder 按 rem_chunk_tokens</text>
<text xml:space="preserve" x="680" y="108.5" text-anchor="start" font-size="11.5" fill="#374151" font-family="PingFang SC, sans-serif">  （--chunked-prefill-size）与可用 +</text>
<text xml:space="preserve" x="680" y="125.5" text-anchor="start" font-size="11.5" fill="#374151" font-family="PingFang SC, sans-serif">  可淘汰 token 预算逐个接纳</text>
<text xml:space="preserve" x="680" y="142.5" text-anchor="start" font-size="11.5" fill="#374151" font-family="PingFang SC, sans-serif">超长请求截断为 chunked_req 分多轮</text>
<text xml:space="preserve" x="680" y="159.5" text-anchor="start" font-size="11.5" fill="#374151" font-family="PingFang SC, sans-serif">lock(last_node) → inc_lock_ref：</text>
<text xml:space="preserve" x="680" y="176.5" text-anchor="start" font-size="11.5" fill="#374151" font-family="PingFang SC, sans-serif">  路径上各节点 lock_ref+1，转为受保护</text>
<rect x="670" y="290" width="318" height="168" rx="7" fill="#edf7f0" stroke="#2e7d4f" stroke-width="1.4"/>
<text xml:space="preserve" x="680" y="309" text-anchor="start" font-size="13.5" font-weight="600" fill="#1f2937" font-family="PingFang SC, sans-serif">④ 分配槽位 alloc_for_extend</text>
<text xml:space="preserve" x="680" y="326.5" text-anchor="start" font-size="11.5" fill="#374151" font-family="PingFang SC, sans-serif">alloc_req_slots → ReqToTokenPool 取一行</text>
<text xml:space="preserve" x="680" y="343.5" text-anchor="start" font-size="11.5" fill="#374151" font-family="PingFang SC, sans-serif">前缀索引写入行首（prefix_device_indices）</text>
<text xml:space="preserve" x="680" y="360.5" text-anchor="start" font-size="11.5" fill="#374151" font-family="PingFang SC, sans-serif">alloc_paged_token_slots_extend →</text>
<text xml:space="preserve" x="680" y="377.5" text-anchor="start" font-size="11.5" fill="#374151" font-family="PingFang SC, sans-serif">  allocator.alloc_extend：先填满 last_loc</text>
<text xml:space="preserve" x="680" y="394.5" text-anchor="start" font-size="11.5" fill="#374151" font-family="PingFang SC, sans-serif">  所在页，再取新页 → out_cache_loc</text>
<text xml:space="preserve" x="680" y="411.5" text-anchor="start" font-size="11.5" fill="#374151" font-family="PingFang SC, sans-serif">不足 → evict_from_tree_cache（见 ⑧）</text>
<rect x="341" y="290" width="318" height="168" rx="7" fill="#eef4fb" stroke="#4a77b4" stroke-width="1.4"/>
<text xml:space="preserve" x="351" y="309" text-anchor="start" font-size="13.5" font-weight="600" fill="#1f2937" font-family="PingFang SC, sans-serif">⑤ 前向计算</text>
<text xml:space="preserve" x="351" y="326.5" text-anchor="start" font-size="11.5" fill="#374151" font-family="PingFang SC, sans-serif">prefill：注意力后端把新 KV 写入</text>
<text xml:space="preserve" x="351" y="343.5" text-anchor="start" font-size="11.5" fill="#374151" font-family="PingFang SC, sans-serif">  k/v_buffer[out_cache_loc]</text>
<text xml:space="preserve" x="351" y="360.5" text-anchor="start" font-size="11.5" fill="#374151" font-family="PingFang SC, sans-serif">分块：stash_chunked_request →</text>
<text xml:space="preserve" x="351" y="377.5" text-anchor="start" font-size="11.5" fill="#374151" font-family="PingFang SC, sans-serif">  checkpoint_kv_cache → tree.checkpoint</text>
<text xml:space="preserve" x="351" y="394.5" text-anchor="start" font-size="11.5" fill="#374151" font-family="PingFang SC, sans-serif">  （先把已算部分插入树并换锁）</text>
<text xml:space="preserve" x="351" y="411.5" text-anchor="start" font-size="11.5" fill="#374151" font-family="PingFang SC, sans-serif">decode：alloc_for_decode 每步 1 槽位/请求</text>
<rect x="12" y="290" width="318" height="168" rx="7" fill="#fdf3e7" stroke="#c9781d" stroke-width="1.4"/>
<text xml:space="preserve" x="22" y="309" text-anchor="start" font-size="13.5" font-weight="600" fill="#1f2937" font-family="PingFang SC, sans-serif">⑥ 生成结束：写回前缀树</text>
<text xml:space="preserve" x="22" y="326.5" text-anchor="start" font-size="11.5" fill="#374151" font-family="PingFang SC, sans-serif">release_kv_cache(req, checkpoint=True)</text>
<text xml:space="preserve" x="22" y="343.5" text-anchor="start" font-size="11.5" fill="#374151" font-family="PingFang SC, sans-serif">  → checkpoint → _insert_cache</text>
<text xml:space="preserve" x="22" y="360.5" text-anchor="start" font-size="11.5" fill="#374151" font-family="PingFang SC, sans-serif">整行页对齐后 insert；_insert_helper</text>
<text xml:space="preserve" x="22" y="377.5" text-anchor="start" font-size="11.5" fill="#374151" font-family="PingFang SC, sans-serif">  返回树中已存在的前缀长度</text>
<text xml:space="preserve" x="22" y="394.5" text-anchor="start" font-size="11.5" fill="#374151" font-family="PingFang SC, sans-serif">重复槽位 [protected, prefix_len)</text>
<text xml:space="preserve" x="22" y="411.5" text-anchor="start" font-size="11.5" fill="#374151" font-family="PingFang SC, sans-serif">  → free_segment；新增部分归树持有</text>
<rect x="12" y="520" width="318" height="150" rx="7" fill="#fdf3e7" stroke="#c9781d" stroke-width="1.4"/>
<text xml:space="preserve" x="22" y="539" text-anchor="start" font-size="13.5" font-weight="600" fill="#1f2937" font-family="PingFang SC, sans-serif">⑦ 释放请求资源</text>
<text xml:space="preserve" x="22" y="556.5" text-anchor="start" font-size="11.5" fill="#374151" font-family="PingFang SC, sans-serif">free_kv_row：释放未入树的尾部</text>
<text xml:space="preserve" x="22" y="573.5" text-anchor="start" font-size="11.5" fill="#374151" font-family="PingFang SC, sans-serif">  （不足一页 / 超分配部分）</text>
<text xml:space="preserve" x="22" y="590.5" text-anchor="start" font-size="11.5" fill="#374151" font-family="PingFang SC, sans-serif">unlock → dec_lock_ref：lock_ref 1→0</text>
<text xml:space="preserve" x="22" y="607.5" text-anchor="start" font-size="11.5" fill="#374151" font-family="PingFang SC, sans-serif">  的节点计入 evictable_size_，成为⑧候选</text>
<text xml:space="preserve" x="22" y="624.5" text-anchor="start" font-size="11.5" fill="#374151" font-family="PingFang SC, sans-serif">release_row：行号归还 free_slots</text>
<rect x="341" y="520" width="647" height="150" rx="7" fill="#fbeeee" stroke="#c0392b" stroke-width="1.4"/>
<text xml:space="preserve" x="351" y="539" text-anchor="start" font-size="13.5" font-weight="600" fill="#1f2937" font-family="PingFang SC, sans-serif">⑧ 淘汰 RadixCache.evict(EvictParams(num_tokens))</text>
<text xml:space="preserve" x="351" y="556.5" text-anchor="start" font-size="11.5" fill="#374151" font-family="PingFang SC, sans-serif">对 evictable_leaves 按 eviction_strategy.get_priority(node) 建最小堆（LRU = last_access_time；</text>
<text xml:space="preserve" x="351" y="573.5" text-anchor="start" font-size="11.5" fill="#374151" font-family="PingFang SC, sans-serif">  另有 lfu / fifo / mru / filo / priority / slru / tlru 等，经 --radix-eviction-policy 选择）</text>
<text xml:space="preserve" x="351" y="590.5" text-anchor="start" font-size="11.5" fill="#374151" font-family="PingFang SC, sans-serif">弹出叶子 → token_to_kv_pool_allocator.free_segment(x.value) → _delete_leaf</text>
<text xml:space="preserve" x="351" y="607.5" text-anchor="start" font-size="11.5" fill="#374151" font-family="PingFang SC, sans-serif">父节点若已无子节点且 lock_ref=0 则入堆，循环直到释放够 num_tokens</text>
<text xml:space="preserve" x="351" y="624.5" text-anchor="start" font-size="11.5" fill="#374151" font-family="PingFang SC, sans-serif">lock_ref&gt;0 的路径永远不会被淘汰；被淘汰的前缀下次只能重算（HiCache 见图 3）</text>
<path d="M330,139 L339,139" fill="none" stroke="#4b5563" stroke-width="1.6" marker-end="url(#ak)"/>
<path d="M659,139 L668,139" fill="none" stroke="#4b5563" stroke-width="1.6" marker-end="url(#ak)"/>
<path d="M829.0,223 L829.0,288" fill="none" stroke="#4b5563" stroke-width="1.6" marker-end="url(#ak)"/>
<path d="M670,374 L661,374" fill="none" stroke="#4b5563" stroke-width="1.6" marker-end="url(#ak)"/>
<path d="M341,374 L332,374" fill="none" stroke="#4b5563" stroke-width="1.6" marker-end="url(#ak)"/>
<path d="M171.0,458 L171.0,518" fill="none" stroke="#4b5563" stroke-width="1.6" marker-end="url(#ak)"/>
<path d="M958,458 L958,518" fill="none" stroke="#c0392b" stroke-width="1.6" stroke-dasharray="6,4" marker-end="url(#ar)"/>
<text xml:space="preserve" x="952" y="478" text-anchor="end" font-size="11" fill="#c0392b" font-family="PingFang SC, sans-serif">空闲不足时触发</text>
<path d="M330,595 L339,595" fill="none" stroke="#c0392b" stroke-width="1.6" stroke-dasharray="6,4" marker-end="url(#ar)"/>
<path d="M500.0,290 L500.0,260 L710,260 L710,288" fill="none" stroke="#2e7d4f" stroke-width="1.6" stroke-dasharray="6,4" marker-end="url(#ag)"/>
<text xml:space="preserve" x="508.0" y="254" text-anchor="start" font-size="10.5" fill="#2e7d4f" font-family="PingFang SC, sans-serif">分块未完成：下一轮继续 ③④</text>
<text xml:space="preserve" x="12" y="700" text-anchor="start" font-size="11" fill="#6b7280" font-family="PingFang SC, sans-serif">源码：managers/scheduler.py、schedule_policy.py；mem_cache/common.py（match_kv_cache / release_kv_cache / evict_from_tree_cache）、</text>
<text xml:space="preserve" x="12" y="718" text-anchor="start" font-size="11" fill="#6b7280" font-family="PingFang SC, sans-serif">allocation.py（alloc_for_extend / alloc_for_decode）、radix_cache.py、allocator/paged.py。默认 UnifiedRadixCache 走同一调用面，但内部改为组件化树核。</text>
<text xml:space="preserve" x="12" y="740" text-anchor="start" font-size="11" fill="#6b7280" font-family="PingFang SC, sans-serif">本图依据固定提交源码绘制；为突出主干，省略了 Mamba/SWA 组件、PD 分离、投机解码与 HiCache 分支。</text>
</svg>