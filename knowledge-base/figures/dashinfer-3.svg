<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760" viewBox="0 0 1000 760"><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#4b5563"/></marker><marker id="arrR" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#c0392b"/></marker><marker id="arrG" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#2e7d4f"/></marker><marker id="arrO" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#c47f17"/></marker></defs><rect x="0" y="0" width="1000" height="760" fill="#ffffff"/><text x="500.0" y="30" text-anchor="middle" font-size="19" font-weight="600" fill="#1f2937" font-family="PingFang SC, sans-serif">一个请求的 KV 分配、复用与释放（AsModel / PrefixCacheManager 调用顺序）</text><rect x="40" y="52" width="560" height="98" rx="7" fill="#eef4fb" stroke="#4a77b4" stroke-width="1.4"/><text x="50" y="72" font-size="13.5" font-weight="600" fill="#1f2937" font-family="PingFang SC, sans-serif">① 调度：AllocPrefillMemory()</text><text x="50" y="91" font-size="12" fill="#374151" font-family="PingFang SC, sans-serif">ExtraEmbeddingUtils::CreateTensorForHash() 生成 input_ids_for_hash</text><text x="50" y="108.5" font-size="12" fill="#374151" font-family="PingFang SC, sans-serif">PrefixCacheManager::RefOnly()：逐 span 计算前缀哈希，查 GPU 表与 CPU 表</text><text x="50" y="126.0" font-size="12" fill="#374151" font-family="PingFang SC, sans-serif">得到 prefix_len 与 gpu_cached_len，UpdateCnt() 记命中 / 未命中 token</text><polyline points="320.0,150 320.0,164" fill="none" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arr)"/><rect x="40" y="164" width="560" height="98" rx="7" fill="#eef4fb" stroke="#4a77b4" stroke-width="1.4"/><text x="50" y="184" font-size="13.5" font-weight="600" fill="#1f2937" font-family="PingFang SC, sans-serif">② 预留帧：CacheFrameManager::PresFrame()</text><text x="50" y="203" font-size="12" fill="#374151" font-family="PingFang SC, sans-serif">context_frame = ⌈(input_len − gpu_cached_len)/span_size⌉ × 2 × 层数</text><text x="50" y="220.5" font-size="12" fill="#374151" font-family="PingFang SC, sans-serif">随后 UnRef()（StartRequest 时再由 RefFill 重新加引用）</text><text x="50" y="238.0" font-size="12" fill="#374151" font-family="PingFang SC, sans-serif">预留不足 → 抛出 ALLSPARK_MEMORY_ERROR，各 rank FreePresFrame() 归还预留</text><polyline points="320.0,262 320.0,276" fill="none" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arr)"/><rect x="40" y="276" width="560" height="98" rx="7" fill="#fdf3e6" stroke="#c47f17" stroke-width="1.4"/><text x="50" y="296" font-size="13.5" font-weight="600" fill="#1f2937" font-family="PingFang SC, sans-serif">③ Prefill：StartRequest → RefFill()</text><text x="50" y="315" font-size="12" fill="#374151" font-family="PingFang SC, sans-serif">GPU 命中：ref_node() + virtual_k/v_cache-&gt;FillCache() 直接挂入 span</text><text x="50" y="332.5" font-size="12" fill="#374151" font-family="PingFang SC, sans-serif">CPU 命中：等待 is_ready，若 CPU 命中长度 ≥ seq_len_thre_ 则 swap_to_gpu_by_nodelist()</text><text x="50" y="350.0" font-size="12" fill="#374151" font-family="PingFang SC, sans-serif">生成 new_input_ids = input_ids[prefix_len:]，runDecoderContext() 只计算未命中部分</text><polyline points="320.0,374 320.0,388" fill="none" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arr)"/><rect x="40" y="388" width="560" height="98" rx="7" fill="#fdf3e6" stroke="#c47f17" stroke-width="1.4"/><text x="50" y="408" font-size="13.5" font-weight="600" fill="#1f2937" font-family="PingFang SC, sans-serif">④ 登记：PrefixCacheManager::Insert(input_ids_for_hash)</text><text x="50" y="427" font-size="12" fill="#374151" font-family="PingFang SC, sans-serif">把本次新算出的完整 span 组装为 PrefixNode 插入 gpu_union_</text><text x="50" y="444.5" font-size="12" fill="#374151" font-family="PingFang SC, sans-serif">GPU 表满：LRUEvictor::FindVictim() 选受害者 → 超 TTL 删除 / 否则换出到 CPU</text><text x="50" y="462.0" font-size="12" fill="#374151" font-family="PingFang SC, sans-serif">最后一个不满 span_size 的尾部 token 不入缓存</text><polyline points="320.0,486 320.0,500" fill="none" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arr)"/><rect x="40" y="500" width="560" height="98" rx="7" fill="#eef8f1" stroke="#2e7d4f" stroke-width="1.4"/><text x="50" y="520" font-size="13.5" font-weight="600" fill="#1f2937" font-family="PingFang SC, sans-serif">⑤ Decode：AllocDecoderMemory()</text><text x="50" y="539" font-size="12" fill="#374151" font-family="PingFang SC, sans-serif">序列长度为 span_size 整数倍时，每请求 PresFrame(2 × 层数) 追加一组 span</text><text x="50" y="556.5" font-size="12" fill="#374151" font-family="PingFang SC, sans-serif">帧不足 → ChooseVictimRequest()（默认 MaxLength：停掉最长请求）</text><text x="50" y="574.0" font-size="12" fill="#374151" font-family="PingFang SC, sans-serif">运行中请求的 KV 不会被换出到 CPU，而是整请求终止</text><polyline points="320.0,598 320.0,612" fill="none" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arr)"/><rect x="40" y="612" width="560" height="98" rx="7" fill="#eef8f1" stroke="#2e7d4f" stroke-width="1.4"/><text x="50" y="632" font-size="13.5" font-weight="600" fill="#1f2937" font-family="PingFang SC, sans-serif">⑥ 结束：StopRequest()</text><text x="50" y="651" font-size="12" fill="#374151" font-family="PingFang SC, sans-serif">CacheArray::Free() → ReleaseSpan()：未被前缀缓存引用的帧回到池</text><text x="50" y="668.5" font-size="12" fill="#374151" font-family="PingFang SC, sans-serif">Insert(generated_ids_for_hash)：输出阶段形成的完整 span 也登记</text><text x="50" y="686.0" font-size="12" fill="#374151" font-family="PingFang SC, sans-serif">UnRef()：ref_cnt 归零的节点加入 LRUEvictor 候选集</text><rect x="630" y="52" width="340" height="656" rx="10" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.2"/><text x="642" y="72" font-size="13" font-weight="600" fill="#4b5563" font-family="PingFang SC, sans-serif">旁注：与 KV 管理相关的参数 / 约束</text><text x="648" y="90" font-size="12.5" fill="#1f2937" text-anchor="start" font-weight="600" font-family="PingFang SC, sans-serif">prefill_cache(True)</text><text x="648" y="108" font-size="12" fill="#4b5563" text-anchor="start" font-weight="normal" font-family="PingFang SC, sans-serif">前缀缓存开关，默认开启（仅 CUDA）</text><text x="648" y="138" font-size="12.5" fill="#1f2937" text-anchor="start" font-weight="600" font-family="PingFang SC, sans-serif">prefix_cache_ttl=300</text><text x="648" y="156" font-size="12" fill="#4b5563" text-anchor="start" font-weight="normal" font-family="PingFang SC, sans-serif">单位秒；只在 GPU 换出时检查</text><text x="648" y="186" font-size="12.5" fill="#1f2937" text-anchor="start" font-weight="600" font-family="PingFang SC, sans-serif">kv_cache_span_size</text><text x="648" y="204" font-size="12" fill="#4b5563" text-anchor="start" font-weight="normal" font-family="PingFang SC, sans-serif">16 / 32 / 64 / 128 个 token</text><text x="648" y="234" font-size="12.5" fill="#1f2937" text-anchor="start" font-weight="600" font-family="PingFang SC, sans-serif">kv_cache_mode</text><text x="648" y="252" font-size="12" fill="#4b5563" text-anchor="start" font-weight="normal" font-family="PingFang SC, sans-serif">Default / QuantI8 / QuantU4</text><text x="648" y="282" font-size="12.5" fill="#1f2937" text-anchor="start" font-weight="600" font-family="PingFang SC, sans-serif">CPU_CACHE_RATIO</text><text x="648" y="300" font-size="12" fill="#4b5563" text-anchor="start" font-weight="normal" font-family="PingFang SC, sans-serif">环境变量，默认 0.0 = 不用 CPU 层</text><text x="648" y="330" font-size="12.5" fill="#1f2937" text-anchor="start" font-weight="600" font-family="PingFang SC, sans-serif">BFC_MEM_RATIO</text><text x="648" y="348" font-size="12" fill="#4b5563" text-anchor="start" font-weight="normal" font-family="PingFang SC, sans-serif">环境变量，BFC 管理显存比例 0.9</text><text x="648" y="378" font-size="12.5" fill="#1f2937" text-anchor="start" font-weight="600" font-family="PingFang SC, sans-serif">AsEvictionStrategy</text><text x="648" y="396" font-size="12" fill="#4b5563" text-anchor="start" font-weight="normal" font-family="PingFang SC, sans-serif">MaxLength（默认）/ Random</text><rect x="645" y="432" width="310" height="250" rx="7" fill="#ffffff" stroke="#6b7280" stroke-width="1.4"/><text x="655" y="452" font-size="13.5" font-weight="600" fill="#1f2937" font-family="PingFang SC, sans-serif">哈希匹配要点</text><text x="655" y="471" font-size="12" fill="#374151" font-family="PingFang SC, sans-serif">· 节点粒度 = 1 个 span（span_size 个 token）</text><text x="655" y="488.5" font-size="12" fill="#374151" font-family="PingFang SC, sans-serif">· 第 k 个节点的键 = 对 tokens[0 .. k×span−1]</text><text x="655" y="506.0" font-size="12" fill="#374151" font-family="PingFang SC, sans-serif">  整段前缀做 MurmurHash3，链式隐含前缀关系</text><text x="655" y="523.5" font-size="12" fill="#374151" font-family="PingFang SC, sans-serif">· 平铺哈希表，不是 radix tree</text><text x="655" y="541.0" font-size="12" fill="#374151" font-family="PingFang SC, sans-serif">· 匹配从头逐 span 进行，首个未命中即停止</text><text x="655" y="558.5" font-size="12" fill="#374151" font-family="PingFang SC, sans-serif">· 只匹配整 span，命中长度为 span_size 倍数</text><text x="655" y="576.0" font-size="12" fill="#374151" font-family="PingFang SC, sans-serif">· 每个 rank 各有一份 PrefixCacheManager</text><text x="655" y="593.5" font-size="12" fill="#374151" font-family="PingFang SC, sans-serif">· VLM 请求的哈希输入由</text><text x="655" y="611.0" font-size="12" fill="#374151" font-family="PingFang SC, sans-serif">  CreateTensorForHash 统一生成</text></svg>
