<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="900" viewBox="0 0 1000 900">
<defs><marker id="ak" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#4b5563"/></marker><marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#c0392b"/></marker><marker id="ag" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#2e7d4f"/></marker><marker id="ab" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#4a77b4"/></marker><marker id="ao" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#c9781d"/></marker><marker id="ap" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#7b5ea7"/></marker></defs>
<rect x="0" y="0" width="1000" height="900" fill="#ffffff"/>
<text xml:space="preserve" x="500.0" y="30" text-anchor="middle" font-size="19" font-weight="600" fill="#1f2937" font-family="PingFang SC, sans-serif">HiCache 三级缓存：L1 GPU ↔ L2 主机内存 ↔ L3 存储后端（固定提交 c712459）</text>
<rect x="12" y="50" width="976" height="136" rx="7" fill="#f3effa" stroke="#7b5ea7" stroke-width="1.4"/>
<text xml:space="preserve" x="22" y="69" text-anchor="start" font-size="13" font-weight="600" fill="#1f2937" font-family="PingFang SC, sans-serif">控制面：UnifiedRadixCache.init_hicache() 挂载 HybridCacheController（继承 managers/cache_controller.py::HiCacheController）</text>
<text xml:space="preserve" x="22" y="86.5" text-anchor="start" font-size="11.5" fill="#374151" font-family="PingFang SC, sans-serif">树节点 UnifiedTreeNode 的 ComponentData 同时记录 value（L1 槽位）与 host_value（L2 槽位）、lock_ref 与 host_lock_ref；L3 元数据不入树，需要时实时查询后端。</text>
<text xml:space="preserve" x="22" y="103.5" text-anchor="start" font-size="11.5" fill="#374151" font-family="PingFang SC, sans-serif">写策略 --hicache-write-policy：write_through（默认，write_through_threshold=1，节点被插入/命中即备份到 L2）；</text>
<text xml:space="preserve" x="22" y="120.5" text-anchor="start" font-size="11.5" fill="#374151" font-family="PingFang SC, sans-serif">  write_through_selective（阈值 2，hit_count 达到 2 才备份）；write_back（插入时不备份，L1 淘汰该叶子时先 D→H 再降级）。</text>
<text xml:space="preserve" x="22" y="137.5" text-anchor="start" font-size="11.5" fill="#374151" font-family="PingFang SC, sans-serif">后台线程：prefetch_thread（L3 命中查询）、prefetch_io_aux_thread（L3→L2 读）、prefetch_sync_thread（多 rank 进度归约）、backup_thread（L2→L3 写）。</text>
<text xml:space="preserve" x="22" y="154.5" text-anchor="start" font-size="11.5" fill="#374151" font-family="PingFang SC, sans-serif">预取停止策略 --hicache-storage-prefetch-policy：best_effort ｜ wait_complete ｜ timeout（默认）；prefetch_threshold 默认 256 token。</text>
<rect x="330" y="235" width="340" height="104" rx="7" fill="#eef4fb" stroke="#4a77b4" stroke-width="1.4"/>
<text xml:space="preserve" x="340" y="254" text-anchor="start" font-size="13.5" font-weight="600" fill="#1f2937" font-family="PingFang SC, sans-serif">L1 · GPU HBM（实例私有）</text>
<text xml:space="preserve" x="340" y="271.5" text-anchor="start" font-size="11.5" fill="#374151" font-family="PingFang SC, sans-serif">token_to_kv_pool_allocator + KV 池</text>
<text xml:space="preserve" x="340" y="288.5" text-anchor="start" font-size="11.5" fill="#374151" font-family="PingFang SC, sans-serif">节点 value = 设备槽位索引</text>
<text xml:space="preserve" x="340" y="305.5" text-anchor="start" font-size="11.5" fill="#374151" font-family="PingFang SC, sans-serif">满了：evict() 取 D-leaf；已备份→_demote</text>
<text xml:space="preserve" x="340" y="322.5" text-anchor="start" font-size="11.5" fill="#374151" font-family="PingFang SC, sans-serif">  降为仅 L2，未备份→直接删除</text>
<rect x="330" y="455" width="340" height="122" rx="7" fill="#edf7f0" stroke="#2e7d4f" stroke-width="1.4"/>
<text xml:space="preserve" x="340" y="474" text-anchor="start" font-size="13.5" font-weight="600" fill="#1f2937" font-family="PingFang SC, sans-serif">L2 · 主机内存 HostKVCache（实例私有）</text>
<text xml:space="preserve" x="340" y="491.5" text-anchor="start" font-size="11.5" fill="#374151" font-family="PingFang SC, sans-serif">pool_host/：容量 = 设备池 × --hicache-ratio</text>
<text xml:space="preserve" x="340" y="508.5" text-anchor="start" font-size="11.5" fill="#374151" font-family="PingFang SC, sans-serif">  （cache 模式默认 2.0）或 --hicache-size GB</text>
<text xml:space="preserve" x="340" y="525.5" text-anchor="start" font-size="11.5" fill="#374151" font-family="PingFang SC, sans-serif">布局 --hicache-mem-layout，默认 page_first</text>
<text xml:space="preserve" x="340" y="542.5" text-anchor="start" font-size="11.5" fill="#374151" font-family="PingFang SC, sans-serif">节点 host_value = 主机槽位；按页 alloc/free</text>
<text xml:space="preserve" x="340" y="559.5" text-anchor="start" font-size="11.5" fill="#374151" font-family="PingFang SC, sans-serif">满了：evict_host → drive_host_eviction</text>
<rect x="330" y="690" width="340" height="104" rx="7" fill="#fdf3e7" stroke="#c9781d" stroke-width="1.4"/>
<text xml:space="preserve" x="340" y="709" text-anchor="start" font-size="13.5" font-weight="600" fill="#1f2937" font-family="PingFang SC, sans-serif">L3 · HiCacheStorage 后端（可跨实例共享）</text>
<text xml:space="preserve" x="340" y="726.5" text-anchor="start" font-size="11.5" fill="#374151" font-family="PingFang SC, sans-serif">file / fast_file / mooncake / hf3fs / nixl /</text>
<text xml:space="preserve" x="340" y="743.5" text-anchor="start" font-size="11.5" fill="#374151" font-family="PingFang SC, sans-serif">  aibrix / eic / simm / dynamic 等</text>
<text xml:space="preserve" x="340" y="760.5" text-anchor="start" font-size="11.5" fill="#374151" font-family="PingFang SC, sans-serif">键 = 页级链式哈希（get_storage_hash_str）</text>
<text xml:space="preserve" x="340" y="777.5" text-anchor="start" font-size="11.5" fill="#374151" font-family="PingFang SC, sans-serif">不在树中保存 L3 元数据</text>
<rect x="12" y="350" width="300" height="120" rx="7" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.4"/>
<text xml:space="preserve" x="22" y="369" text-anchor="start" font-size="13.5" font-weight="600" fill="#1f2937" font-family="PingFang SC, sans-serif">写入 L2（D→H）</text>
<text xml:space="preserve" x="22" y="386.5" text-anchor="start" font-size="11.5" fill="#374151" font-family="PingFang SC, sans-serif">insert 时 _inc_hit_count_and_check</text>
<text xml:space="preserve" x="22" y="403.5" text-anchor="start" font-size="11.5" fill="#374151" font-family="PingFang SC, sans-serif">  达阈值 → cache_controller.write()</text>
<text xml:space="preserve" x="22" y="420.5" text-anchor="start" font-size="11.5" fill="#374151" font-family="PingFang SC, sans-serif">host 池 alloc → write_queue → start_writing</text>
<text xml:space="preserve" x="22" y="437.5" text-anchor="start" font-size="11.5" fill="#374151" font-family="PingFang SC, sans-serif">  → device_to_host 流；writing_check 收 ack</text>
<text xml:space="preserve" x="22" y="454.5" text-anchor="start" font-size="11.5" fill="#374151" font-family="PingFang SC, sans-serif">write_back：evict_device_leaf 时才备份</text>
<rect x="12" y="585" width="300" height="104" rx="7" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.4"/>
<text xml:space="preserve" x="22" y="604" text-anchor="start" font-size="13.5" font-weight="600" fill="#1f2937" font-family="PingFang SC, sans-serif">写入 L3（H→L3）</text>
<text xml:space="preserve" x="22" y="621.5" text-anchor="start" font-size="11.5" fill="#374151" font-family="PingFang SC, sans-serif">L2 写 ack 后 write_backup_storage(node)</text>
<text xml:space="preserve" x="22" y="638.5" text-anchor="start" font-size="11.5" fill="#374151" font-family="PingFang SC, sans-serif">  → write_storage → backup_queue</text>
<text xml:space="preserve" x="22" y="655.5" text-anchor="start" font-size="11.5" fill="#374151" font-family="PingFang SC, sans-serif">backup_thread_func → _page_backup</text>
<text xml:space="preserve" x="22" y="672.5" text-anchor="start" font-size="11.5" fill="#374151" font-family="PingFang SC, sans-serif">  每批 128 页 batch_set / batch_set_v1</text>
<rect x="688" y="340" width="300" height="136" rx="7" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.4"/>
<text xml:space="preserve" x="698" y="359" text-anchor="start" font-size="13.5" font-weight="600" fill="#1f2937" font-family="PingFang SC, sans-serif">回载 L1（H→D）</text>
<text xml:space="preserve" x="698" y="376.5" text-anchor="start" font-size="11.5" fill="#374151" font-family="PingFang SC, sans-serif">match_prefix 返回 host_hit_length</text>
<text xml:space="preserve" x="698" y="393.5" text-anchor="start" font-size="11.5" fill="#374151" font-family="PingFang SC, sans-serif">PrefillAdder → init_load_back → load_back</text>
<text xml:space="preserve" x="698" y="410.5" text-anchor="start" font-size="11.5" fill="#374151" font-family="PingFang SC, sans-serif">  → controller.load：分配设备槽位 → load_queue</text>
<text xml:space="preserve" x="698" y="427.5" text-anchor="start" font-size="11.5" fill="#374151" font-family="PingFang SC, sans-serif">  → start_loading：host_to_device 流</text>
<text xml:space="preserve" x="698" y="444.5" text-anchor="start" font-size="11.5" fill="#374151" font-family="PingFang SC, sans-serif">LayerDoneCounter：第 N 层计算时加载 N+1 层</text>
<text xml:space="preserve" x="698" y="461.5" text-anchor="start" font-size="11.5" fill="#374151" font-family="PingFang SC, sans-serif">不足 load_back_threshold（10）token 不回载</text>
<rect x="688" y="540" width="300" height="150" rx="7" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.4"/>
<text xml:space="preserve" x="698" y="559" text-anchor="start" font-size="13.5" font-weight="600" fill="#1f2937" font-family="PingFang SC, sans-serif">预取 L2（L3→H）</text>
<text xml:space="preserve" x="698" y="576.5" text-anchor="start" font-size="11.5" fill="#374151" font-family="PingFang SC, sans-serif">入队 _prefetch_kvcache → prefetch_from_storage</text>
<text xml:space="preserve" x="698" y="593.5" text-anchor="start" font-size="11.5" fill="#374151" font-family="PingFang SC, sans-serif">  L1/L2 未命中部分 ≥ prefetch_threshold 才发起</text>
<text xml:space="preserve" x="698" y="610.5" text-anchor="start" font-size="11.5" fill="#374151" font-family="PingFang SC, sans-serif">prefetch_thread：batch_exists 数连续命中页</text>
<text xml:space="preserve" x="698" y="627.5" text-anchor="start" font-size="11.5" fill="#374151" font-family="PingFang SC, sans-serif">  → all_reduce(MIN) 统一各 rank 命中数</text>
<text xml:space="preserve" x="698" y="644.5" text-anchor="start" font-size="11.5" fill="#374151" font-family="PingFang SC, sans-serif">prefetch_io_aux：每批 128 页 batch_get(_v1)</text>
<text xml:space="preserve" x="698" y="661.5" text-anchor="start" font-size="11.5" fill="#374151" font-family="PingFang SC, sans-serif">  PrefetchAck.completed_tokens 记已取 token</text>
<text xml:space="preserve" x="698" y="678.5" text-anchor="start" font-size="11.5" fill="#374151" font-family="PingFang SC, sans-serif">check_prefetch_progress 按策略终止并插入树</text>
<path d="M370,339 L370,453" fill="none" stroke="#2e7d4f" stroke-width="1.6" marker-end="url(#ag)"/>
<path d="M370,577 L370,688" fill="none" stroke="#c9781d" stroke-width="1.6" marker-end="url(#ao)"/>
<path d="M312,410 L364,410" fill="none" stroke="#2e7d4f" stroke-width="1.6" stroke-dasharray="6,4" marker-end="url(#ag)"/>
<path d="M312,637 L364,637" fill="none" stroke="#c9781d" stroke-width="1.6" stroke-dasharray="6,4" marker-end="url(#ao)"/>
<path d="M630,455 L630,341" fill="none" stroke="#4a77b4" stroke-width="1.6" marker-end="url(#ab)"/>
<path d="M630,690 L630,579" fill="none" stroke="#4a77b4" stroke-width="1.6" marker-end="url(#ab)"/>
<path d="M688,408 L636,408" fill="none" stroke="#4a77b4" stroke-width="1.6" stroke-dasharray="6,4" marker-end="url(#ab)"/>
<path d="M688,615 L636,615" fill="none" stroke="#4a77b4" stroke-width="1.6" stroke-dasharray="6,4" marker-end="url(#ab)"/>
<text xml:space="preserve" x="380" y="400" text-anchor="start" font-size="11.5" fill="#2e7d4f" font-family="PingFang SC, sans-serif">备份</text>
<text xml:space="preserve" x="380" y="640" text-anchor="start" font-size="11.5" fill="#c9781d" font-family="PingFang SC, sans-serif">持久化</text>
<text xml:space="preserve" x="620" y="400" text-anchor="end" font-size="11.5" fill="#4a77b4" font-family="PingFang SC, sans-serif">回载</text>
<text xml:space="preserve" x="620" y="640" text-anchor="end" font-size="11.5" fill="#4a77b4" font-family="PingFang SC, sans-serif">预取</text>
<text xml:space="preserve" x="12" y="822" text-anchor="start" font-size="12.5" font-weight="600" fill="#1f2937" font-family="PingFang SC, sans-serif">节点状态（UnifiedTreeNode.evicted / backuped）</text>
<rect x="12" y="832" width="238" height="56" rx="7" fill="#eef4fb" stroke="#4a77b4" stroke-width="1.4"/>
<text xml:space="preserve" x="22" y="851" text-anchor="start" font-size="12.5" font-weight="600" fill="#1f2937" font-family="PingFang SC, sans-serif">仅 L1</text>
<text xml:space="preserve" x="22" y="868" text-anchor="start" font-size="11" fill="#374151" font-family="PingFang SC, sans-serif">value≠None，host_value=None</text>
<rect x="258" y="832" width="238" height="56" rx="7" fill="#edf7f0" stroke="#2e7d4f" stroke-width="1.4"/>
<text xml:space="preserve" x="268" y="851" text-anchor="start" font-size="12.5" font-weight="600" fill="#1f2937" font-family="PingFang SC, sans-serif">L1 + L2</text>
<text xml:space="preserve" x="268" y="868" text-anchor="start" font-size="11" fill="#374151" font-family="PingFang SC, sans-serif">已备份（backuped），可安全降级</text>
<rect x="504" y="832" width="238" height="56" rx="7" fill="#fdf3e7" stroke="#c9781d" stroke-width="1.4"/>
<text xml:space="preserve" x="514" y="851" text-anchor="start" font-size="12.5" font-weight="600" fill="#1f2937" font-family="PingFang SC, sans-serif">仅 L2</text>
<text xml:space="preserve" x="514" y="868" text-anchor="start" font-size="11" fill="#374151" font-family="PingFang SC, sans-serif">evicted 且 backuped，可 load_back</text>
<rect x="750" y="832" width="238" height="56" rx="7" fill="#fbeeee" stroke="#c0392b" stroke-width="1.4"/>
<text xml:space="preserve" x="760" y="851" text-anchor="start" font-size="12.5" font-weight="600" fill="#1f2937" font-family="PingFang SC, sans-serif">已删除</text>
<text xml:space="preserve" x="760" y="868" text-anchor="start" font-size="11" fill="#374151" font-family="PingFang SC, sans-serif">evicted 且未备份，下次需重算/预取</text>
</svg>