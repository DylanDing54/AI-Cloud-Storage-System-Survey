<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="720" viewBox="0 0 1000 720"><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#4b5563"/></marker><marker id="arrR" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#c0392b"/></marker><marker id="arrG" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#2e7d4f"/></marker><marker id="arrO" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#c47f17"/></marker></defs><rect x="0" y="0" width="1000" height="720" fill="#ffffff"/><text x="500.0" y="30" text-anchor="middle" font-size="19" font-weight="600" fill="#1f2937" font-family="PingFang SC, sans-serif">DashInfer KV 缓存的数据结构与内存层级（固定提交 06669fa）</text><rect x="20" y="50" width="590" height="560" rx="10" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.2"/><text x="32" y="70" font-size="13" font-weight="600" fill="#4b5563" font-family="PingFang SC, sans-serif">GPU 显存 · 每个 TP rank 一个 AsModel</text><rect x="38" y="80" width="554" height="82" rx="7" fill="#eef4fb" stroke="#4a77b4" stroke-width="1.4"/><text x="48" y="100" font-size="13.5" font-weight="600" fill="#1f2937" font-family="PingFang SC, sans-serif">CudaCacheAllocator + BFC 分配器</text><text x="48" y="119" font-size="12" fill="#374151" font-family="PingFang SC, sans-serif">Warmup：可用显存 − 1.1 × 运行时峰值（LoRA 时 1.5×）</text><text x="48" y="136.5" font-size="12" fill="#374151" font-family="PingFang SC, sans-serif">  → cache_frame_manager_-&gt;GrowBy(n)；BFC_MEM_RATIO 默认 0.9</text><rect x="38" y="176" width="554" height="100" rx="7" fill="#eef4fb" stroke="#4a77b4" stroke-width="1.4"/><text x="48" y="196" font-size="13.5" font-weight="600" fill="#1f2937" font-family="PingFang SC, sans-serif">CacheFrameManager（Default / Concurrent）· CacheFrame 池</text><text x="48" y="215" font-size="12" fill="#374151" font-family="PingFang SC, sans-serif">每帧 = 一个 span 的字节数，CacheUtils::GetSpanSizeInBytes()：</text><text x="48" y="232.5" font-size="12" fill="#374151" font-family="PingFang SC, sans-serif">  span_size × (KV head 数 / rank) × head_size × 元素字节（量化另加参数）</text><text x="48" y="250.0" font-size="12" fill="#374151" font-family="PingFang SC, sans-serif">AllocFrame / FreeFrame / PresFrame（预留）/ CountFreeFrame</text><rect x="38" y="290" width="554" height="82" rx="7" fill="#eef4fb" stroke="#4a77b4" stroke-width="1.4"/><text x="48" y="310" font-size="13.5" font-weight="600" fill="#1f2937" font-family="PingFang SC, sans-serif">CacheSpanManager · CacheSpan</text><text x="48" y="329" font-size="12" fill="#374151" font-family="PingFang SC, sans-serif">ClaimSpan(tag, n) / ReleaseSpan(span)</text><text x="48" y="346.5" font-size="12" fill="#374151" font-family="PingFang SC, sans-serif">has_extra_ref_ 为真（被前缀缓存引用）时 ReleaseSpan 不归还帧</text><polyline points="315,162 315,176" fill="none" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arr)"/><polyline points="315,276 315,290" fill="none" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arr)"/><rect x="38" y="400" width="262" height="150" rx="7" fill="#eef8f1" stroke="#2e7d4f" stroke-width="1.4"/><text x="48" y="420" font-size="13.5" font-weight="600" fill="#1f2937" font-family="PingFang SC, sans-serif">请求 KV：GenerateContext</text><text x="48" y="439" font-size="12" fill="#374151" font-family="PingFang SC, sans-serif">virtual_k_cache / virtual_v_cache</text><text x="48" y="456.5" font-size="12" fill="#374151" font-family="PingFang SC, sans-serif">（SpannedVirtualCache）</text><text x="48" y="474.0" font-size="12" fill="#374151" font-family="PingFang SC, sans-serif">→ 每层一个 CacheArray</text><text x="48" y="491.5" font-size="12" fill="#374151" font-family="PingFang SC, sans-serif">→ vector&lt;CacheSpan::Ptr&gt;</text><text x="48" y="509.0" font-size="12" fill="#374151" font-family="PingFang SC, sans-serif">GetCache()：按需追加 span</text><text x="48" y="526.5" font-size="12" fill="#374151" font-family="PingFang SC, sans-serif">FillCache()：挂入已缓存 span</text><rect x="330" y="400" width="262" height="150" rx="7" fill="#fdf3e6" stroke="#c47f17" stroke-width="1.4"/><text x="340" y="420" font-size="13.5" font-weight="600" fill="#1f2937" font-family="PingFang SC, sans-serif">PrefixCacheManager::gpu_union_</text><text x="340" y="439" font-size="12" fill="#374151" font-family="PingFang SC, sans-serif">CacheUnion(DeviceType::CUDA)</text><text x="340" y="456.5" font-size="12" fill="#374151" font-family="PingFang SC, sans-serif">hash_table：hash → PrefixNode</text><text x="340" y="474.0" font-size="12" fill="#374151" font-family="PingFang SC, sans-serif">evictor：LRUEvictor（std::set）</text><text x="340" y="491.5" font-size="12" fill="#374151" font-family="PingFang SC, sans-serif">  仅含 ref_cnt==0 的节点</text><text x="340" y="509.0" font-size="12" fill="#374151" font-family="PingFang SC, sans-serif">capacity：UpdateCapacity()</text><text x="340" y="526.5" font-size="12" fill="#374151" font-family="PingFang SC, sans-serif">  扣除运行中请求预留后的帧数</text><polyline points="169,372 169,400" fill="none" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arr)"/><text x="176" y="390" font-size="11.5" fill="#4b5563" text-anchor="start" font-family="PingFang SC, sans-serif">ClaimSpan</text><polyline points="461,372 461,400" fill="none" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arr)"/><text x="468" y="390" font-size="11.5" fill="#4b5563" text-anchor="start" font-family="PingFang SC, sans-serif">共享同一帧池</text><polyline points="330,455 300,455" fill="none" stroke="#c47f17" stroke-width="1.5" marker-end="url(#arrO)"/><polyline points="300,490 330,490" fill="none" stroke="#c47f17" stroke-width="1.5" marker-end="url(#arrO)"/><text x="315" y="446" font-size="10.5" fill="#c47f17" text-anchor="middle" font-weight="normal" font-family="PingFang SC, sans-serif">RefFill</text><text x="315" y="507" font-size="10.5" fill="#c47f17" text-anchor="middle" font-weight="normal" font-family="PingFang SC, sans-serif">Insert</text><rect x="38" y="566" width="554" height="30" rx="7" fill="#ffffff" stroke="#6b7280" stroke-width="1.4"/><text x="48" y="586" font-size="12" fill="#374151" text-anchor="start" font-weight="normal" font-family="PingFang SC, sans-serif">SpanAttention 解码核按 [batch, nSpansPerRequest] span 指针数组读取 KV；自身不管理 span</text><polyline points="169,550 169,566" fill="none" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arr)"/><rect x="640" y="50" width="340" height="560" rx="10" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.2"/><text x="652" y="70" font-size="13" font-weight="600" fill="#4b5563" font-family="PingFang SC, sans-serif">主机内存 · 仅 CPU_CACHE_RATIO &gt; 0 时启用</text><rect x="655" y="80" width="310" height="168" rx="7" fill="#ffffff" stroke="#6b7280" stroke-width="1.4"/><text x="665" y="100" font-size="13.5" font-weight="600" fill="#1f2937" font-family="PingFang SC, sans-serif">PrefixNode（每 span_size 个 token）</text><text x="665" y="119" font-size="12" fill="#374151" font-family="PingFang SC, sans-serif">k_cache[L] / v_cache[L]：每层 1 个 span</text><text x="665" y="136.5" font-size="12" fill="#374151" font-family="PingFang SC, sans-serif">ref_cnt：引用它的在途请求数</text><text x="665" y="154.0" font-size="12" fill="#374151" font-family="PingFang SC, sans-serif">prefix_len：从开头到本节点的 token 数</text><text x="665" y="171.5" font-size="12" fill="#374151" font-family="PingFang SC, sans-serif">last_access_time / is_ready</text><text x="665" y="189.0" font-size="12" fill="#374151" font-family="PingFang SC, sans-serif">hash：MurmurHash3_x86_32(tokens[0..i])</text><text x="665" y="206.5" font-size="12" fill="#374151" font-family="PingFang SC, sans-serif">  32 位，表中不保存 token 本身</text><rect x="655" y="262" width="310" height="100" rx="7" fill="#eef4fb" stroke="#4a77b4" stroke-width="1.4"/><text x="665" y="282" font-size="13.5" font-weight="600" fill="#1f2937" font-family="PingFang SC, sans-serif">MemcpyWorkspace + ThreadPool(32)</text><text x="665" y="301" font-size="12" fill="#374151" font-family="PingFang SC, sans-serif">cudaMallocHost 固定内存，max_batch 块</text><text x="665" y="318.5" font-size="12" fill="#374151" font-family="PingFang SC, sans-serif">D2H 后由线程池 memcpy 到 CPU span，</text><text x="665" y="336.0" font-size="12" fill="#374151" font-family="PingFang SC, sans-serif">完成后 set_node_ready()</text><rect x="655" y="380" width="310" height="170" rx="7" fill="#fdf3e6" stroke="#c47f17" stroke-width="1.4"/><text x="665" y="400" font-size="13.5" font-weight="600" fill="#1f2937" font-family="PingFang SC, sans-serif">PrefixCacheManager::cpu_union_</text><text x="665" y="419" font-size="12" fill="#374151" font-family="PingFang SC, sans-serif">CacheUnion(DeviceType::CPU)</text><text x="665" y="436.5" font-size="12" fill="#374151" font-family="PingFang SC, sans-serif">独立 DefaultCacheFrameManager(CPU)</text><text x="665" y="454.0" font-size="12" fill="#374151" font-family="PingFang SC, sans-serif">容量 =（MemAvailable × CPU_CACHE_RATIO</text><text x="665" y="471.5" font-size="12" fill="#374151" font-family="PingFang SC, sans-serif">  − 固定内存工作区 × nranks）/ nranks</text><text x="665" y="489.0" font-size="12" fill="#374151" font-family="PingFang SC, sans-serif">  / 帧字节数 / (2 × 层数)</text><text x="665" y="506.5" font-size="12" fill="#374151" font-family="PingFang SC, sans-serif">满时 LRU 受害者 delete_node 释放</text><polyline points="592,440 655,440" fill="none" stroke="#c47f17" stroke-width="1.5" marker-end="url(#arrO)"/><polyline points="655,500 592,500" fill="none" stroke="#c47f17" stroke-width="1.5" marker-end="url(#arrO)"/><text x="623" y="432" font-size="11" fill="#c47f17" text-anchor="middle" font-weight="normal" font-family="PingFang SC, sans-serif">换出</text><text x="623" y="518" font-size="11" fill="#c47f17" text-anchor="middle" font-weight="normal" font-family="PingFang SC, sans-serif">换入</text><rect x="20" y="626" width="960" height="80" rx="10" fill="#fff5f5" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="7 5"/><text x="32" y="646" font-size="13" font-weight="600" fill="#4b5563" font-family="PingFang SC, sans-serif"></text><text x="500" y="658" font-size="13.5" fill="#c0392b" text-anchor="middle" font-weight="600" font-family="PingFang SC, sans-serif">SSD / HDD / 远端存储：固定提交源码中没有对应的 CacheUnion、存储后端类、文件 I/O 或外部 KV 连接器接口</text><text x="500" y="684" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="normal" font-family="PingFang SC, sans-serif">CPU 层淘汰的 PrefixNode 直接释放；进程重启或 Reset() 后两层前缀缓存全部清空。单机 PD 模式的 decode worker 经 BuildModelFromPeer 共享上述对象</text></svg>
