<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640"><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#4b5563"/></marker><marker id="arrR" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#c0392b"/></marker><marker id="arrG" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#2e7d4f"/></marker><marker id="arrO" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#c47f17"/></marker></defs><rect x="0" y="0" width="1000" height="640" fill="#ffffff"/><text x="500.0" y="30" text-anchor="middle" font-size="19" font-weight="600" fill="#1f2937" font-family="PingFang SC, sans-serif">GPU→CPU 换出、CPU 淘汰与换入路径，以及 HDD 层的候选挂点（红色虚线为需新增部分）</text><rect x="30" y="60" width="290" height="112" rx="7" fill="#eef4fb" stroke="#4a77b4" stroke-width="1.4"/><text x="40" y="80" font-size="13.5" font-weight="600" fill="#1f2937" font-family="PingFang SC, sans-serif">触发：GPU 表需要空位</text><text x="40" y="99" font-size="12" fill="#374151" font-family="PingFang SC, sans-serif">Insert()：gpu hash_table 已满</text><text x="40" y="116.5" font-size="12" fill="#374151" font-family="PingFang SC, sans-serif">RefFill()：CPU 命中需换入，先</text><text x="40" y="134.0" font-size="12" fill="#374151" font-family="PingFang SC, sans-serif">  evict_unrefered_by_num(exceed)</text><text x="40" y="151.5" font-size="12" fill="#374151" font-family="PingFang SC, sans-serif">EvictAllUnrefered()：预热请求结束后</text><rect x="30" y="196" width="290" height="96" rx="7" fill="#eef4fb" stroke="#4a77b4" stroke-width="1.4"/><text x="40" y="216" font-size="13.5" font-weight="600" fill="#1f2937" font-family="PingFang SC, sans-serif">LRUEvictor::FindVictim / FindMultiVictims</text><text x="40" y="235" font-size="12" fill="#374151" font-family="PingFang SC, sans-serif">候选 = ref_cnt==0 的 GPU 节点</text><text x="40" y="252.5" font-size="12" fill="#374151" font-family="PingFang SC, sans-serif">排序：last_access_time 早者先；同一时间</text><text x="40" y="270.0" font-size="12" fill="#374151" font-family="PingFang SC, sans-serif">  prefix_len 更长者先（先淘汰尾部节点）</text><rect x="30" y="316" width="290" height="86" rx="7" fill="#fdecea" stroke="#c0392b" stroke-width="1.4"/><text x="40" y="336" font-size="13.5" font-weight="600" fill="#1f2937" font-family="PingFang SC, sans-serif">filter_timeout_hash()</text><text x="40" y="355" font-size="12" fill="#374151" font-family="PingFang SC, sans-serif">now − last_access_time &gt; prefix_cache_ttl</text><text x="40" y="372.5" font-size="12" fill="#374151" font-family="PingFang SC, sans-serif">→ delete_node(CUDA)：直接丢弃，不换出</text><polyline points="175,172 175,196" fill="none" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arr)"/><polyline points="175,292 175,316" fill="none" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arr)"/><rect x="360" y="60" width="300" height="150" rx="7" fill="#fdf3e6" stroke="#c47f17" stroke-width="1.4"/><text x="370" y="80" font-size="13.5" font-weight="600" fill="#1f2937" font-family="PingFang SC, sans-serif">换出：swap_nodelist_to_cpu_impl()</text><text x="370" y="99" font-size="12" fill="#374151" font-family="PingFang SC, sans-serif">1. alloc_cpu_node()：CPU 表满则 CPU LRU</text><text x="370" y="116.5" font-size="12" fill="#374151" font-family="PingFang SC, sans-serif">   受害者 delete_node(CPU)，再 ClaimSpan</text><text x="370" y="134.0" font-size="12" fill="#374151" font-family="PingFang SC, sans-serif">2. SpanToContCopyLauncher：离散 span →</text><text x="370" y="151.5" font-size="12" fill="#374151" font-family="PingFang SC, sans-serif">   GPU workspace 连续缓冲（同步）</text><text x="370" y="169.0" font-size="12" fill="#374151" font-family="PingFang SC, sans-serif">3. cudaMemcpyAsync D2H → 固定内存块</text><text x="370" y="186.5" font-size="12" fill="#374151" font-family="PingFang SC, sans-serif">4. 线程池 memcpy 到 CPU span → is_ready</text><polyline points="320,359 340,359 340,135 360,135" fill="none" stroke="#c47f17" stroke-width="1.5" marker-end="url(#arrO)"/><text x="338" y="309" font-size="11.5" fill="#c47f17" text-anchor="end" font-family="PingFang SC, sans-serif">未超时</text><rect x="360" y="236" width="300" height="72" rx="7" fill="#eef4fb" stroke="#4a77b4" stroke-width="1.4"/><text x="370" y="256" font-size="13.5" font-weight="600" fill="#1f2937" font-family="PingFang SC, sans-serif">delete_multinodes(CUDA)</text><text x="370" y="275" font-size="12" fill="#374151" font-family="PingFang SC, sans-serif">GPU 节点 unref + ReleaseSpan，帧回池；</text><text x="370" y="292.5" font-size="12" fill="#374151" font-family="PingFang SC, sans-serif">随后把新节点插入 GPU 表</text><polyline points="510,210 510,236" fill="none" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arr)"/><rect x="360" y="332" width="300" height="140" rx="7" fill="#eef8f1" stroke="#2e7d4f" stroke-width="1.4"/><text x="370" y="352" font-size="13.5" font-weight="600" fill="#1f2937" font-family="PingFang SC, sans-serif">换入：swap_to_gpu_by_nodelist</text><text x="370" y="371" font-size="12" fill="#374151" font-family="PingFang SC, sans-serif">alloc_gpu_node()：从请求的 VirtualCache</text><text x="370" y="388.5" font-size="12" fill="#374151" font-family="PingFang SC, sans-serif">  GetCache() 取新 span</text><text x="370" y="406.0" font-size="12" fill="#374151" font-family="PingFang SC, sans-serif">memcpy CPU span → 固定内存（主线程）</text><text x="370" y="423.5" font-size="12" fill="#374151" font-family="PingFang SC, sans-serif">→ H2D → ContToSpanCopyLauncher</text><text x="370" y="441.0" font-size="12" fill="#374151" font-family="PingFang SC, sans-serif">→ insert_node(CUDA)；整段同步完成后</text><text x="370" y="458.5" font-size="12" fill="#374151" font-family="PingFang SC, sans-serif">  才继续 prefill</text><rect x="700" y="60" width="270" height="150" rx="7" fill="#fdf3e6" stroke="#c47f17" stroke-width="1.4"/><text x="710" y="80" font-size="13.5" font-weight="600" fill="#1f2937" font-family="PingFang SC, sans-serif">CPU 层（cpu_union_）</text><text x="710" y="99" font-size="12" fill="#374151" font-family="PingFang SC, sans-serif">容量受 CPU_CACHE_RATIO 限制</text><text x="710" y="116.5" font-size="12" fill="#374151" font-family="PingFang SC, sans-serif">无 TTL 检查，只按 LRU 淘汰</text><text x="710" y="134.0" font-size="12" fill="#374151" font-family="PingFang SC, sans-serif">RefOnly / RefFill 命中时刷新</text><text x="710" y="151.5" font-size="12" fill="#374151" font-family="PingFang SC, sans-serif">  last_access_time</text><text x="710" y="169.0" font-size="12" fill="#374151" font-family="PingFang SC, sans-serif">被淘汰节点：delete_node(CPU)</text><text x="710" y="186.5" font-size="12" fill="#374151" font-family="PingFang SC, sans-serif">  → 内容永久丢失</text><polyline points="660,120 700,120" fill="none" stroke="#c47f17" stroke-width="1.5" marker-end="url(#arrO)"/><polyline points="760,210 760,400 660,400" fill="none" stroke="#2e7d4f" stroke-width="1.5" marker-end="url(#arrG)"/><text x="768" y="300" font-size="11.5" fill="#2e7d4f" text-anchor="start" font-family="PingFang SC, sans-serif">CPU 命中</text><rect x="700" y="250" width="270" height="118" rx="7" fill="#fff5f5" stroke="#c0392b" stroke-width="1.4" stroke-dasharray="6 4"/><text x="710" y="270" font-size="13.5" font-weight="600" fill="#c0392b" font-family="PingFang SC, sans-serif">新增 ①：CPU 淘汰时下沉</text><text x="710" y="289" font-size="12" fill="#374151" font-family="PingFang SC, sans-serif">在 alloc_cpu_node() 的 CPU 受害者</text><text x="710" y="306.5" font-size="12" fill="#374151" font-family="PingFang SC, sans-serif">delete_node 之前，把节点（2L 个 span，</text><text x="710" y="324.0" font-size="12" fill="#374151" font-family="PingFang SC, sans-serif">已是连续缓冲）异步追加写入 HDD</text><text x="710" y="341.5" font-size="12" fill="#374151" font-family="PingFang SC, sans-serif">需要：写队列、背压、聚合成大块</text><rect x="30" y="430" width="290" height="150" rx="7" fill="#fff5f5" stroke="#c0392b" stroke-width="1.4" stroke-dasharray="6 4"/><text x="40" y="450" font-size="13.5" font-weight="600" fill="#c0392b" font-family="PingFang SC, sans-serif">新增 ②：两层都未命中时查 HDD</text><text x="40" y="469" font-size="12" fill="#374151" font-family="PingFang SC, sans-serif">RefOnly / RefFill 在 GPU、CPU 都未</text><text x="40" y="486.5" font-size="12" fill="#374151" font-family="PingFang SC, sans-serif">命中处 break；需改为查询 HDD 索引，</text><text x="40" y="504.0" font-size="12" fill="#374151" font-family="PingFang SC, sans-serif">调度阶段异步预取到 CPU 层，</text><text x="40" y="521.5" font-size="12" fill="#374151" font-family="PingFang SC, sans-serif">超时或带宽不足则按现有路径重算</text><text x="40" y="539.0" font-size="12" fill="#374151" font-family="PingFang SC, sans-serif">（new_input_ids 从 prefix_len 起）</text><rect x="360" y="490" width="610" height="120" rx="7" fill="#fff5f5" stroke="#c0392b" stroke-width="1.4" stroke-dasharray="6 4"/><text x="370" y="510" font-size="13.5" font-weight="600" fill="#c0392b" font-family="PingFang SC, sans-serif">新增 ③：HDD 层自身</text><text x="370" y="529" font-size="12" fill="#374151" font-family="PingFang SC, sans-serif">· 与 CacheUnion 并列的存储后端类 + 持久化索引；键需含模型、dtype、</text><text x="370" y="546.5" font-size="12" fill="#374151" font-family="PingFang SC, sans-serif">  kv_cache_mode、span_size、TP rank，并存 token 或强哈希做校验</text><text x="370" y="564.0" font-size="12" fill="#374151" font-family="PingFang SC, sans-serif">· 容量回收、崩溃恢复与 fsync 语义；准入（只下沉长 / 高复用前缀）</text><text x="370" y="581.5" font-size="12" fill="#374151" font-family="PingFang SC, sans-serif">· 恢复耗时预测：预计慢于重算时直接放弃读取</text><polyline points="835,210 835,250" fill="none" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrR)"/><polyline points="320,505 345,505 345,450 360,450" fill="none" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrR)"/><text x="175" y="600" font-size="11.5" fill="#c0392b" text-anchor="middle" font-family="PingFang SC, sans-serif">预取到 CPU 层后复用现有换入路径</text></svg>
