<rect x="377.5" y="95" width="20.5" height="40" fill="#bee3f8" stroke="#a0aec0"/>
<rect x="400.0" y="95" width="20.5" height="40" fill="#bee3f8" stroke="#a0aec0"/>
<rect x="422.5" y="95" width="20.5" height="40" fill="#bee3f8" stroke="#a0aec0"/>
<rect x="445.0" y="95" width="20.5" height="40" fill="#bee3f8" stroke="#a0aec0"/>
<rect x="467.5" y="95" width="20.5" height="40" fill="#bee3f8" stroke="#a0aec0"/>
