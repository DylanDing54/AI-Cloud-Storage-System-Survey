<text x="20" y="28" font-size="17" font-weight="600" fill="#1a202c">DeepSeek V4.1 Flash 的 KV 组成与每 token 字节估算（本文估算）</text>
<text x="20" y="48" font-size="11.5" text-anchor="start" fill="#4a5568">依据：HF config.json（40 层，compress_ratios，kv_source_layer_ids = [2, 8, 14, 20]）与 DeepInfer cache_engine.py 的分配逻辑；块大小 128 token，main KV 默认 FP4。</text>
<rect x="20" y="62" width="960" height="165" rx="10" fill="#f7f9fc" stroke="#a0aec0" stroke-dasharray="5 4"/>
<text x="32" y="82" font-size="13" font-weight="600" fill="#4a5568">① 40 层主干如何分配 KV（层号从 0 计）</text>
