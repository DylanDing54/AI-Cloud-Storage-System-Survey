<rect x="580.0" y="95" width="20.5" height="40" fill="#fbd38d" stroke="#a0aec0"/>
<rect x="602.5" y="95" width="20.5" height="40" fill="#fbd38d" stroke="#a0aec0"/>
<rect x="625.0" y="95" width="20.5" height="40" fill="#fbd38d" stroke="#a0aec0"/>
<rect x="647.5" y="95" width="20.5" height="40" fill="#fbd38d" stroke="#a0aec0"/>
<rect x="670.0" y="95" width="20.5" height="40" fill="#fbd38d" stroke="#a0aec0"/>
