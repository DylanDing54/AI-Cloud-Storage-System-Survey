<text x="230.25" y="120" font-size="11" text-anchor="middle" fill="#1a202c" font-weight="600">8</text>
<rect x="242.5" y="95" width="20.5" height="40" fill="#bee3f8" stroke="#a0aec0"/>
<rect x="265.0" y="95" width="20.5" height="40" fill="#bee3f8" stroke="#a0aec0"/>
<rect x="287.5" y="95" width="20.5" height="40" fill="#bee3f8" stroke="#a0aec0"/>
<rect x="310.0" y="95" width="20.5" height="40" fill="#bee3f8" stroke="#a0aec0"/>
<rect x="332.5" y="95" width="20.5" height="40" fill="#bee3f8" stroke="#a0aec0"/>
