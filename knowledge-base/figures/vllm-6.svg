<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="800" viewBox="0 0 1000 800" font-family="PingFang SC, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker></defs>
<rect x="0" y="0" width="1000" height="800" fill="#ffffff"/>
<text x="20" y="28" font-size="17" font-weight="600" fill="#1a202c">KV 下沉到文件系统 / HDD 的三条官方路径（固定提交 0c80c3a6）</text>
<rect x="15" y="45" width="600" height="515" rx="10" fill="#f7f9fc" stroke="#a0aec0" stroke-dasharray="5 4"/>
<text x="27" y="65" font-size="13" font-weight="600" fill="#4a5568">A · OffloadingConnector + TieringOffloadingSpec + fs 二级层（vLLM 原生）</text>
<rect x="30" y="75" width="270" height="60" rx="6" fill="#f0fff4" stroke="#3c8d5a" stroke-width="1.3"/>
<text x="165.0" y="100.0" font-size="12.5" text-anchor="middle" fill="#1a202c" font-weight="600">GPU HBM：BlockPool 分页 KV</text>
<text x="165.0" y="117.5" font-size="12.5" text-anchor="middle" fill="#1a202c">block_size 由后端 / --block-size 决定</text>
<rect x="30" y="175" width="270" height="75" rx="6" fill="#f0fff4" stroke="#3c8d5a" stroke-width="1.3"/>
<text x="165.0" y="198.8" font-size="12.5" text-anchor="middle" fill="#1a202c" font-weight="600">CPU 主层 CPUOffloadingManager</text>
<text x="165.0" y="216.2" font-size="12.5" text-anchor="middle" fill="#1a202c">cpu_bytes_to_use（全部 worker 合计）</text>
<text x="165.0" y="233.8" font-size="12.5" text-anchor="middle" fill="#1a202c">eviction_policy：lru / arc</text>
<path d="M80,135 L80,173" fill="none" stroke="#4a5568" stroke-width="1.5" marker-end="url(#a)"/>
<text x="88" y="158" font-size="11" fill="#4a5568" text-anchor="start">store：swap_blocks_batch（DMA）</text>
<path d="M270,173 L270,137" fill="none" stroke="#4a5568" stroke-width="1.5" marker-end="url(#a)"/>
<text x="276" y="160" font-size="11" fill="#4a5568" text-anchor="start">load</text>
<rect x="30" y="290" width="270" height="90" rx="6" fill="#ebf4ff" stroke="#4a77b4" stroke-width="1.3"/>
<text x="165.0" y="312.5" font-size="12.5" text-anchor="middle" fill="#1a202c" font-weight="600">FileSystemTierManager（type: &quot;fs&quot;）</text>
<text x="165.0" y="330.0" font-size="12.5" text-anchor="middle" fill="#1a202c">DualQueueThreadPool</text>
<text x="165.0" y="347.5" font-size="12.5" text-anchor="middle" fill="#1a202c">n_read_threads=16 / n_write_threads=16</text>
<text x="165.0" y="365.0" font-size="12.5" text-anchor="middle" fill="#1a202c">submit_store / submit_load 非阻塞</text>
<path d="M80,250 L80,288" fill="none" stroke="#4a5568" stroke-width="1.5" marker-end="url(#a)"/>
<text x="88" y="266" font-size="11" fill="#4a5568" text-anchor="start">cascade（存入主层即级联）</text>
<path d="M270,288 L270,252" fill="none" stroke="#4a5568" stroke-width="1.5" marker-end="url(#a)"/>
<text x="262" y="284" font-size="11" fill="#4a5568" text-anchor="end">promotion</text>
<rect x="30" y="420" width="270" height="125" rx="6" fill="#edf2f7" stroke="#4a5568" stroke-width="1.3"/>
<text x="165.0" y="451.2" font-size="12.5" text-anchor="middle" fill="#1a202c" font-weight="600">root_dir（放在 HDD 挂载点）</text>
<text x="165.0" y="468.8" font-size="12.5" text-anchor="middle" fill="#1a202c">&lt;model&gt;_&lt;digest&gt;_r&lt;rank&gt;/</text>
<text x="165.0" y="486.2" font-size="12.5" text-anchor="middle" fill="#1a202c">&lt;hhh&gt;/&lt;hh&gt;_g&lt;group&gt;/&lt;hash&gt;.bin</text>
<text x="165.0" y="503.8" font-size="12.5" text-anchor="middle" fill="#1a202c">每个 chunk 一个文件</text>
<text x="165.0" y="521.2" font-size="12.5" text-anchor="middle" fill="#1a202c">fs 层内无容量上限与淘汰</text>
<path d="M120,380 L120,418" fill="none" stroke="#4a5568" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="320" y="75" width="280" height="110" rx="6" fill="#fff5f5" stroke="#c0392b" stroke-width="1.3"/>
<text x="460.0" y="98.8" font-size="12.5" text-anchor="middle" fill="#1a202c" font-weight="600">写：batch_store_block()</text>
<text x="460.0" y="116.2" font-size="12.5" text-anchor="middle" fill="#1a202c">exists(dest) 则跳过</text>
<text x="460.0" y="133.8" font-size="12.5" text-anchor="middle" fill="#1a202c">open(tmp, O_CREAT|O_EXCL[|O_DIRECT])</text>
<text x="460.0" y="151.2" font-size="12.5" text-anchor="middle" fill="#1a202c">→ write() → os.replace(tmp, dest)</text>
<text x="460.0" y="168.8" font-size="12.5" text-anchor="middle" fill="#1a202c">源码中无 fsync / fdatasync</text>
<rect x="320" y="205" width="280" height="110" rx="6" fill="#fff5f5" stroke="#c0392b" stroke-width="1.3"/>
<text x="460.0" y="228.8" font-size="12.5" text-anchor="middle" fill="#1a202c" font-weight="600">读：batch_load_block()</text>
<text x="460.0" y="246.2" font-size="12.5" text-anchor="middle" fill="#1a202c">open(path[, O_DIRECT]) → os.readv()</text>
<text x="460.0" y="263.8" font-size="12.5" text-anchor="middle" fill="#1a202c">短读：删除该文件并抛 OSError</text>
<text x="460.0" y="281.2" font-size="12.5" text-anchor="middle" fill="#1a202c">O_DIRECT 不可用时探测后回退</text>
<text x="460.0" y="298.8" font-size="12.5" text-anchor="middle" fill="#1a202c">缓冲 I/O（probe_o_direct）</text>
<rect x="320" y="335" width="280" height="210" rx="6" fill="#fffaf0" stroke="#c99a2e" stroke-width="1.3"/>
<text x="460.0" y="358.5" font-size="12" text-anchor="middle" fill="#1a202c" font-weight="600">调度侧查找与回退</text>
<text x="460.0" y="375.5" font-size="12" text-anchor="middle" fill="#1a202c">OffloadingConnectorScheduler</text>
<text x="460.0" y="392.5" font-size="12" text-anchor="middle" fill="#1a202c">.get_num_new_matched_tokens()</text>
<text x="460.0" y="409.5" font-size="12" text-anchor="middle" fill="#1a202c">→ TieringOffloadingManager.lookup()</text>
<text x="460.0" y="426.5" font-size="12" text-anchor="middle" fill="#1a202c">CPU 命中 → HIT</text>
<text x="460.0" y="443.5" font-size="12" text-anchor="middle" fill="#1a202c">fs 命中（faccessat 异步查找）</text>
<text x="460.0" y="460.5" font-size="12" text-anchor="middle" fill="#1a202c">→ _initiate_promotion() → HIT_PENDING</text>
<text x="460.0" y="477.5" font-size="12" text-anchor="middle" fill="#1a202c">RETRY / HIT_PENDING → 返回 None，</text>
<text x="460.0" y="494.5" font-size="12" text-anchor="middle" fill="#1a202c">本步跳过该请求，无超时上限</text>
<text x="460.0" y="511.5" font-size="12" text-anchor="middle" fill="#1a202c">promotion 失败：失败块及其后 mark_miss</text>
<text x="460.0" y="528.5" font-size="12" text-anchor="middle" fill="#1a202c">→ 按 MISS 由 GPU 重算</text>
<path d="M300,470 L318,470" fill="none" stroke="#4a5568" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="630" y="45" width="355" height="330" rx="10" fill="#f7f9fc" stroke="#a0aec0" stroke-dasharray="5 4"/>
<text x="642" y="65" font-size="13" font-weight="600" fill="#4a5568">B · LMCache connector（外部库）</text>
<rect x="645" y="75" width="325" height="130" rx="6" fill="#faf5ff" stroke="#805ad5" stroke-width="1.3"/>
<text x="807.5" y="101.0" font-size="12" text-anchor="middle" fill="#1a202c" font-weight="600">LMCacheConnectorV1（进程内模式，</text>
<text x="807.5" y="118.0" font-size="12" text-anchor="middle" fill="#1a202c">LMCache 文档标注已弃用）</text>
<text x="807.5" y="135.0" font-size="12" text-anchor="middle" fill="#1a202c">LocalCPUBackend → LocalDiskBackend</text>
<text x="807.5" y="152.0" font-size="12" text-anchor="middle" fill="#1a202c">local_disk / max_local_disk_size</text>
<text x="807.5" y="169.0" font-size="12" text-anchor="middle" fill="#1a202c">每 chunk 一个文件；put 异步，get 阻塞</text>
<text x="807.5" y="186.0" font-size="12" text-anchor="middle" fill="#1a202c">可 prefetch 到 CPU；LRU 等策略淘汰</text>
<rect x="645" y="225" width="325" height="135" rx="6" fill="#faf5ff" stroke="#805ad5" stroke-width="1.3"/>
<text x="807.5" y="253.5" font-size="12" text-anchor="middle" fill="#1a202c" font-weight="600">LMCacheMPConnector</text>
<text x="807.5" y="270.5" font-size="12" text-anchor="middle" fill="#1a202c">--kv-offloading-backend lmcache 的默认</text>
<text x="807.5" y="287.5" font-size="12" text-anchor="middle" fill="#1a202c">lmcache server：L1（--l1-size-gb）</text>
<text x="807.5" y="304.5" font-size="12" text-anchor="middle" fill="#1a202c">→ L2 adapter {&quot;type&quot;: &quot;fs&quot;,</text>
<text x="807.5" y="321.5" font-size="12" text-anchor="middle" fill="#1a202c">&quot;base_path&quot;: …}：aiofiles 写 .data，</text>
<text x="807.5" y="338.5" font-size="12" text-anchor="middle" fill="#1a202c">临时目录 + 原子 rename，可选 O_DIRECT</text>
<rect x="630" y="390" width="355" height="170" rx="10" fill="#f7f9fc" stroke="#a0aec0" stroke-dasharray="5 4"/>
<text x="642" y="410" font-size="13" font-weight="600" fill="#4a5568">C · SimpleCPUOffloadConnector（disk 模式）</text>
<rect x="645" y="420" width="325" height="125" rx="6" fill="#fefcbf" stroke="#b7791f" stroke-width="1.3"/>
<text x="807.5" y="443.5" font-size="12" text-anchor="middle" fill="#1a202c" font-weight="600">kv_offload_backend=&quot;disk&quot;</text>
<text x="807.5" y="460.5" font-size="12" text-anchor="middle" fill="#1a202c">disk_path + disk_capacity_bytes（默认 100 GiB）</text>
<text x="807.5" y="477.5" font-size="12" text-anchor="middle" fill="#1a202c">每 rank 一个预分配大文件，按 slot 定位</text>
<text x="807.5" y="494.5" font-size="12" text-anchor="middle" fill="#1a202c">pinned 双缓冲 + pwritev / preadv</text>
<text x="807.5" y="511.5" font-size="12" text-anchor="middle" fill="#1a202c">默认 O_DIRECT；启动与关闭时 unlink</text>
<text x="807.5" y="528.5" font-size="12" text-anchor="middle" fill="#1a202c">→ 只作进程内容量扩展，不持久</text>
<rect x="15" y="580" width="970" height="205" rx="10" fill="#f7f9fc" stroke="#a0aec0" stroke-dasharray="5 4"/>
<text x="27" y="600" font-size="13" font-weight="600" fill="#4a5568">共同的 HDD 风险点（源码 / 文档可确认的机制）</text>
<rect x="30" y="610" width="300" height="160" rx="6" fill="#ebf4ff" stroke="#4a77b4" stroke-width="1.3"/>
<text x="180.0" y="651.0" font-size="12" text-anchor="middle" fill="#1a202c" font-weight="600">写入吸收</text>
<text x="180.0" y="668.0" font-size="12" text-anchor="middle" fill="#1a202c">chunk 存入 CPU 主层后级联到所有二级层</text>
<text x="180.0" y="685.0" font-size="12" text-anchor="middle" fill="#1a202c">可选 backpressure：</text>
<text x="180.0" y="702.0" font-size="12" text-anchor="middle" fill="#1a202c">EMABackpressureDetector</text>
<text x="180.0" y="719.0" font-size="12" text-anchor="middle" fill="#1a202c">+ DropStorePolicy / ThrottledDropPolicy</text>
<text x="180.0" y="736.0" font-size="12" text-anchor="middle" fill="#1a202c">fs 默认按 LOCAL 水位（NVMe 标定）</text>
<rect x="345" y="610" width="300" height="160" rx="6" fill="#ebf4ff" stroke="#4a77b4" stroke-width="1.3"/>
<text x="495.0" y="651.0" font-size="12" text-anchor="middle" fill="#1a202c" font-weight="600">读取等待</text>
<text x="495.0" y="668.0" font-size="12" text-anchor="middle" fill="#1a202c">promotion 先到 CPU 再到 GPU</text>
<text x="495.0" y="685.0" font-size="12" text-anchor="middle" fill="#1a202c">慢盘 = 请求停在 None / RETRY</text>
<text x="495.0" y="702.0" font-size="12" text-anchor="middle" fill="#1a202c">可用 kv_transfer_params：</text>
<text x="495.0" y="719.0" font-size="12" text-anchor="middle" fill="#1a202c">max_load_tokens（0 关闭外部加载）</text>
<text x="495.0" y="736.0" font-size="12" text-anchor="middle" fill="#1a202c">kv_load_tiers（选择二级层）</text>
<rect x="660" y="610" width="310" height="160" rx="6" fill="#ebf4ff" stroke="#4a77b4" stroke-width="1.3"/>
<text x="815.0" y="651.0" font-size="12" text-anchor="middle" fill="#1a202c" font-weight="600">失败与持久</text>
<text x="815.0" y="668.0" font-size="12" text-anchor="middle" fill="#1a202c">GPU 侧加载错误：kv_load_failure_policy</text>
<text x="815.0" y="685.0" font-size="12" text-anchor="middle" fill="#1a202c">（默认 fail，可设 recompute）</text>
<text x="815.0" y="702.0" font-size="12" text-anchor="middle" fill="#1a202c">fs 层：tmp + rename 防半写可见</text>
<text x="815.0" y="719.0" font-size="12" text-anchor="middle" fill="#1a202c">但无 fsync，掉电持久性未承诺</text>
<text x="815.0" y="736.0" font-size="12" text-anchor="middle" fill="#1a202c">容量回收需外部清理旧 digest 目录</text>
</svg>